<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Forbrew · 咖啡落單</title>
  <meta name="description" content="Forbrew 選擇不同咖啡杯：以互動 3D 挑選咖啡落單，100% 完整移植客人 4 步落單、轉數快 99KB 壓縮、Stripe Express 分賬、商戶控制台與平台後台風控系統。" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=JetBrains+Mono:wght@500;700&family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@600;900&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet" />

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
    }
  }
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #faf7f2;
      --paper: #f2ece1;
      --surface: #ffffff;
      --fg: #141413;
      --mut: #6b6a66;
      --line: #dcd3c4;
      --acc: #d97757;
      --ok: #2f8f5b;
      --warn: #e8a317;
      --bad: #c0392b;
      --serif: "Fraunces", "Iowan Old Style", "Noto Serif TC", Georgia, serif;
      --sans: "Plus Jakarta Sans", "Noto Sans TC", "PingFang HK", system-ui, sans-serif;
      --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, monospace;
      color-scheme: light;
    }

    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: var(--sans);
      font-size: 15px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      padding-bottom: 48px;
    }

    /* Editorial Top Masthead */
    .masthead {
      position: sticky;
      top: 0;
      z-index: 40;
      background: var(--bg);
      border-bottom: 1px solid var(--line);
    }
    .masthead-in {
      max-width: 1320px;
      margin: 0 auto;
      padding: 0 20px;
      min-height: 60px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--fg);
      text-decoration: none;
    }
    .brand-mark { width: 28px; height: 24px; display: inline-flex; align-items: center; }
    .brand-name {
      font-family: var(--serif);
      font-weight: 800;
      font-size: 21px;
      letter-spacing: 0.02em;
    }

    /* Top Role Switcher (Customer /c/SHOP · Barista / · Platform /admin) */
    .role-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }
    .role-btn {
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--mut);
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      padding: 7px 13px;
      border-radius: 4px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: border-color 0.15s, background-color 0.15s, color 0.15s;
    }
    .role-btn:hover { border-color: var(--fg); color: var(--fg); }
    .role-btn.on {
      background: var(--fg);
      border-color: var(--fg);
      color: var(--bg);
    }
    .role-count {
      font-family: var(--mono);
      font-size: 11px;
      background: var(--warn);
      color: #141413;
      padding: 1px 6px;
      border-radius: 3px;
      font-variant-numeric: tabular-nums;
    }

    .util-nav { display: flex; align-items: center; gap: 8px; }
    .mini-btn {
      border: 1px solid var(--fg);
      background: var(--surface);
      color: var(--fg);
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 700;
      padding: 6px 11px;
      border-radius: 4px;
      cursor: pointer;
    }
    .mini-btn:hover { background: var(--paper); }

    .shell { max-width: 1320px; margin: 0 auto; padding: 0 20px; }

    /* Compact Header Band */
    .sub-band {
      padding: 18px 0 14px;
      border-bottom: 1px solid var(--line);
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: 14px;
    }
    .kicker {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--acc);
      margin-bottom: 4px;
    }
    .band-title {
      font-family: var(--serif);
      font-size: clamp(1.55rem, 2.8vw, 2.25rem);
      font-weight: 800;
      line-height: 1.15;
    }
    .shop-status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 700;
      border: 1px solid var(--line);
      background: var(--surface);
      padding: 6px 12px;
      border-radius: 4px;
    }
    .status-sq { width: 9px; height: 9px; border-radius: 2px; background: var(--mut); }
    .status-sq.ok { background: var(--ok); }

    /* 3D Bookshelf Coffee Selector Stage (Left 58% · Right 42%) */
    .cust-stage {
      display: grid;
      grid-template-columns: 1.32fr 1fr;
      gap: 22px;
      padding: 20px 0 28px;
      align-items: stretch;
    }
    .shelf-card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 560px;
    }
    .shelf-top-bar {
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      padding: 10px 14px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .grp-tabs { display: flex; flex-wrap: wrap; gap: 6px; }
    .grp-btn {
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--mut);
      font: inherit;
      font-size: 12px;
      font-weight: 700;
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
    }
    .grp-btn.on { background: var(--acc); border-color: var(--acc); color: #fff; }
    .canvas-wrap {
      position: relative;
      flex: 1;
      width: 100%;
      min-height: 400px;
      cursor: grab;
    }
    .canvas-wrap:active { cursor: grabbing; }
    .canvas-wrap canvas { display: block; width: 100%; height: 100%; }

    .shelf-fallback {
      display: none;
      padding: 24px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 12px;
      flex: 1;
    }
    .shelf-fallback.on { display: flex; }

    .shelf-foot {
      background: var(--surface);
      border-top: 1px solid var(--line);
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .drink-spine-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }
    .spine-chip {
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--fg);
      font: inherit;
      font-size: 12px;
      font-weight: 700;
      padding: 5px 9px;
      border-radius: 4px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .spine-chip:hover { border-color: var(--fg); }
    .spine-chip.on {
      background: var(--fg);
      border-color: var(--fg);
      color: var(--bg);
    }
    .spine-chip small { font-family: var(--mono); opacity: 0.8; font-variant-numeric: tabular-nums; }
    .shelf-hint { font-family: var(--mono); font-size: 11px; color: var(--mut); }

    /* Right Synchronized Guest Order Desk */
    .order-desk {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 14px;
    }
    .prog { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .prog div {
      border: 1px solid var(--line);
      background: var(--bg);
      text-align: center;
      font-size: 12px;
      font-weight: 800;
      color: var(--mut);
      padding: 8px 4px;
      border-radius: 4px;
    }
    .prog div b {
      display: block;
      font-family: var(--mono);
      font-size: 16px;
      margin-bottom: 2px;
    }
    .prog div.on { background: var(--acc); border-color: var(--acc); color: #fff; }

    /* Merchant & Admin Full Workspace Panels */
    .console-wrap { max-width: 960px; margin: 22px auto 0; }
    .seg {
      display: flex;
      flex-wrap: wrap;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 3px;
      margin-top: 12px;
      gap: 3px;
    }
    .seg button {
      flex: 1;
      min-width: 78px;
      border: 0;
      background: none;
      color: var(--mut);
      font: inherit;
      font-weight: 700;
      font-size: 13px;
      padding: 7px 8px;
      border-radius: 4px;
      cursor: pointer;
    }
    .seg button.on { background: var(--fg); color: var(--bg); }
    .seg i {
      font-style: normal;
      background: var(--warn);
      color: #141413;
      border-radius: 3px;
      padding: 0 5px;
      margin-left: 4px;
      font-family: var(--mono);
      font-size: 11px;
    }

    .card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 16px;
      margin-top: 14px;
    }
    .panel-box {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 16px;
      margin-top: 12px;
    }
    .ord {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 14px;
      margin-top: 12px;
    }
    .ord.hot { border-color: var(--acc); border-width: 2px; }
    .ord h4 {
      font-size: 17px;
      font-weight: 800;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .tag-st {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 700;
      border-radius: 3px;
      padding: 2px 8px;
      border: 1px solid var(--line);
      background: var(--paper);
      color: var(--fg);
    }
    .tag-st.paid { background: var(--warn); border-color: var(--warn); color: #141413; }
    .tag-st.making { background: var(--acc); border-color: var(--acc); color: #fff; }
    .tag-st.ready { background: var(--ok); border-color: var(--ok); color: #fff; }

    .lab {
      font-size: 11px;
      color: var(--mut);
      margin: 10px 0 5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .row { display: flex; flex-wrap: wrap; gap: 7px; }
    .chip {
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--fg);
      border-radius: 4px;
      padding: 8px 12px;
      font: inherit;
      font-weight: 700;
      font-size: 13px;
      min-height: 40px;
      cursor: pointer;
      text-align: left;
    }
    .chip:hover { border-color: var(--fg); }
    .chip.on { background: var(--acc); border-color: var(--acc); color: #fff; }
    .chip small { display: block; font-family: var(--mono); font-size: 11px; opacity: 0.85; font-variant-numeric: tabular-nums; }
    .chip.sm { padding: 6px 10px; min-height: 34px; font-size: 12px; }

    .qty { display: flex; align-items: center; gap: 12px; }
    .qty button {
      width: 38px;
      height: 38px;
      border-radius: 4px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--fg);
      font-size: 18px;
      cursor: pointer;
    }
    .qty b { font-family: var(--mono); font-size: 18px; min-width: 24px; text-align: center; }

    input[type=text], input[type=tel], input[type=password], input[type=search], select {
      width: 100%;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--fg);
      border-radius: 4px;
      padding: 10px 11px;
      font: inherit;
      font-size: 14px;
      margin-top: 6px;
    }
    .pw { position: relative; margin-top: 6px; }
    .pw input { margin-top: 0 !important; padding-right: 68px; }
    .pw .eye {
      position: absolute;
      right: 5px;
      top: 50%;
      transform: translateY(-50%);
      border: 1px solid var(--line);
      background: var(--paper);
      color: var(--fg);
      border-radius: 3px;
      padding: 4px 9px;
      font: inherit;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
    }

    .kv {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 9px 0;
      border-top: 1px solid var(--line);
    }
    .kv:first-child { border-top: 0; }
    .kv b { font-family: var(--mono); font-size: 17px; font-variant-numeric: tabular-nums; }

    .btn {
      width: 100%;
      border: 0;
      border-radius: 4px;
      background: var(--acc);
      color: #fff;
      font: inherit;
      font-weight: 800;
      font-size: 15px;
      min-height: 46px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 14px;
      text-decoration: none;
    }
    .btn:disabled { background: var(--line); color: var(--mut); cursor: not-allowed; }
    .btn.ok { background: var(--ok); }
    .btn.warn { background: var(--warn); color: #141413; }
    .btn.dark { background: var(--fg); color: var(--bg); }
    .btn.inline { margin-top: 10px; }

    .mini {
      border: 1px solid var(--fg);
      background: var(--surface);
      color: var(--fg);
      border-radius: 4px;
      padding: 5px 10px;
      font: inherit;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      min-height: 32px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
    }
    .link {
      background: none;
      border: 0;
      color: var(--mut);
      text-decoration: underline;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
      margin-top: 8px;
      padding: 4px 0;
      display: inline-block;
    }

    .st { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
    .st div { border: 1px solid var(--line); background: var(--surface); border-radius: 4px; padding: 11px; }
    .st small { color: var(--mut); font-weight: 700; font-size: 11px; display: block; }
    .st b { font-size: 20px; font-family: var(--mono); font-variant-numeric: tabular-nums; display: block; }
    .st span { font-size: 11px; color: var(--mut); }
    .st .g { background: rgba(47, 143, 91, 0.08); }
    .st .w { background: rgba(232, 163, 23, 0.1); }
    .st .r { background: rgba(192, 57, 43, 0.08); }

    .bd { border: 1px solid var(--line); background: var(--surface); border-radius: 4px; padding: 12px; margin-top: 10px; }
    .bd div { display: flex; justify-content: space-between; font-size: 13px; margin-top: 7px; font-variant-numeric: tabular-nums; }
    .bd i { display: block; height: 6px; border-radius: 2px; background: var(--line); margin-top: 3px; overflow: hidden; }
    .bd i u { display: block; height: 100%; background: var(--acc); }

    .tw { overflow-x: auto; margin-top: 12px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); }
    table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
    th, td { padding: 8px 10px; text-align: left; border-top: 1px solid var(--line); white-space: nowrap; }
    th { background: var(--paper); border-top: 0; font-weight: 800; font-size: 12px; }

    .ar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-radius: 4px;
      border: 1px solid var(--line);
      background: var(--paper);
      margin-top: 10px;
      cursor: pointer;
      font-weight: 800;
      width: 100%;
      color: var(--fg);
      font: inherit;
      text-align: left;
    }
    .ar small { font-weight: 600; color: var(--mut); display: block; font-size: 12px; }
    .adet {
      padding: 12px 14px 16px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-top: 0;
      border-radius: 0 0 4px 4px;
      margin-top: -2px;
    }

    .qr { width: 190px; height: 190px; margin: 10px auto; border: 1px solid var(--line); background: #fff; padding: 6px; border-radius: 4px; }
    .qr svg { width: 100%; height: 100%; display: block; }
    .rcimg { max-width: 100%; max-height: 220px; border-radius: 4px; border: 1px solid var(--line); margin-top: 8px; display: block; }
    .redstar { color: #e02424; font-weight: 900; }
    .m { color: var(--mut); font-size: 13px; margin-top: 4px; }
    .tr { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 13px; }
    .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

    #toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      background: var(--fg);
      color: var(--bg);
      padding: 9px 16px;
      border-radius: 4px;
      font-weight: 700;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s;
      z-index: 60;
    }
    #toast.on { opacity: 1; }

    :focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }

    @media (max-width: 960px) {
      .cust-stage { grid-template-columns: 1fr; }
      .shelf-card { min-height: 430px; }
      .st { grid-template-columns: 1fr 1fr; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      * { transition: none !important; animation: none !important; }
    }
  </style>
</head>
<body>
  <header class="masthead">
    <div class="masthead-in">
      <a href="#top" class="brand" id="top" onclick="setMode('customer');return false">
        <span class="brand-mark" id="brand-mascot"></span>
        <span class="brand-name">Forbrew</span>
      </a>

      <nav class="role-nav" aria-label="Forbrew Mode Switcher">
        <button type="button" class="role-btn on" id="nav-customer" onclick="setMode('customer')">客人落單 <span class="mono" id="nav-shop-slug" style="font-size:11px;opacity:.75">/c/TEAM-A</span></button>
        <button type="button" class="role-btn" id="nav-merchant" onclick="setMode('merchant')">咖啡師控制台 <span class="role-count" id="paid-badge">0</span></button>
        <button type="button" class="role-btn" id="nav-admin" onclick="setMode('admin')">平台後台 <span class="mono" style="font-size:11px;opacity:.75">/admin</span></button>
      </nav>

      <div class="util-nav">
        <button type="button" class="mini-btn" id="lg" onclick="setLang()">EN</button>
        <button type="button" class="mini-btn" onclick="resetDemoHub()" title="還原預設示範狀態">重設</button>
      </div>
    </div>
  </header>

  <main class="shell" id="main-shell"></main>
  <div id="toast" role="status"></div>

  <script>
    /* =====================================================================
       FORBREW SHARED CORE (100% ported from shared.js & worker.js)
       ===================================================================== */
    const MASCOT = `<svg viewBox="0 0 16 14" aria-hidden="true"><ellipse cx="8" cy="13.2" rx="6" ry=".7" fill="currentColor" opacity=".12"/><g fill="var(--acc)"><rect x="3" y="1" width="10" height="7"/><rect x="1" y="3" width="2" height="3"/><rect x="13" y="3" width="2" height="3"/><rect x="4" y="8" width="2" height="3"/><rect x="10" y="8" width="2" height="3"/><rect x="7" y="8" width="2" height="2"/></g><g fill="none" stroke="#141413" stroke-width=".6" stroke-linecap="square"><polyline points="5,3.2 6.8,4.2 5,5.2"/><polyline points="11,3.2 9.2,4.2 11,5.2"/></g></svg>`;
    document.getElementById("brand-mascot").innerHTML = MASCOT;

    const T = {
      bl_why:["原因（選填）","Reason (optional)"],
      bl_rm:["移除黑名單","Remove from blacklist"],
      bl_add:["加入黑名單 ★","Add to blacklist ★"],
      bl_note:["紅星 ★ 會出現喺呢啲客人嘅訂單同客人記錄。客人、其他商戶同平台後台都睇唔到。以稱呼同電話尾 4 位配對。","A red star ★ marks these customers in your orders and CRM. Customers, other shops and the platform admin cannot see it. Matched by name and last 4 digits."],
      bl_h:["黑名單（只有你間店睇到）","Blacklist (visible to your shop only)"],
      sdash:["開 Stripe 後台（睇出款同收入）","Open Stripe dashboard (payouts and earnings)"],
      dispute:["⚠ 爭議中（客人向銀行爭議咗呢單）","⚠ Disputed (the customer disputed this charge with their bank)"],
      rfdone:["已退款","Refunded"],

    function feeFps(shop, tot = 40) {
      const st = HUB.settings;
      const base = Math.min(4, Math.max(2, shop.fee != null ? shop.fee : st.fee));
      if (tot <= st.lowp) return r2(Math.min(base, st.lowf));
      return r2(base);
    }
    function feeStripe(shop, tot) {
      const st = HUB.settings;
      const base = Math.min(4, Math.max(2, shop.fee != null ? shop.fee : st.fee));
      const pct = tot <= st.thr ? st.pct : st.pct2;
      return r2(Math.max(st.cmin, base + st.fix + (pct / 100) * tot));
    }
    function billOf(code) {
      const f = HUB.fees.filter(x => x.code === code);
      const p = HUB.pays.filter(x => x.code === code);
      const fees = r2(f.reduce((a, b) => a + b.amt, 0));
      const col = r2(f.filter(x => x.col === 1).reduce((a, b) => a + b.amt, 0));
      const paid = r2(p.reduce((a, b) => a + b.amt, 0));
      return { orders: f.length, fees, collected: col, owed: r2(fees - col), paid, due: r2(fees - col - paid) };
    }
    function qualityOf(code) {
      const now = Date.now(), D = 864e5, D30 = 30 * D;
      const rows = HUB.ratings.filter(r => r.code === code && r.ts >= now - 90 * D).sort((a, b) => b.ts - a.ts);
      const avg = a => a.length ? Math.round(a.reduce((x, y) => x + y.score, 0) / a.length * 10) / 10 : null;
      const pc = (c, n) => n ? Math.round(c * 1000 / n) / 10 : null;
      const w30 = rows.filter(r => r.ts >= now - D30);
      const w7 = rows.filter(r => r.ts >= now - 7 * D);
      const p7 = rows.filter(r => r.ts < now - 7 * D && r.ts >= now - 14 * D);
      return {
        n: w30.length, avg: avg(w30), min: 5,
        perfect: pc(w30.filter(r => !r.tags.length).length, w30.length),
        trend: { now: w7.length >= 3 ? avg(w7) : null, prev: p7.length >= 3 ? avg(p7) : null },
        tags: Object.keys(QTAGS).map(tag => {
          const c = w30.filter(r => r.tags.includes(tag)).length;
          return { tag, pts: QTAGS[tag][0], dim: QTAGS[tag][1], count: c, pct: pc(c, w30.length) || 0, lost: c * QTAGS[tag][0] };
        }),
        actions: HUB.actions.filter(a => a.code === code).sort((a, b) => b.ts - a.ts).map(a => {
          const bf = rows.filter(r => r.ts < a.ts && r.ts >= a.ts - D30);
          const af = rows.filter(r => r.ts >= a.ts);
          const rate = l => l.length >= 3 ? pc(l.filter(r => r.tags.includes(a.tag)).length, l.length) : null;
          return { ts: a.ts, tag: a.tag, before: rate(bf), after: rate(af) };
        })
      };
    }

      let p = it.p;
      if (it.g !== "spec") p += x.size === "L" ? cf.L : x.size === "S" ? cf.S : 0;
      if (!it.b && x.milk === "OM") p += cf.om;
      if (x.bean === "soe") p += cf.so;
      return Math.max(0, p) * x.qty;
    }

    /* Authentic 99KB Canvas Shrink from c.html */
    function shrink(f, max = 99 * 1024) {
      return new Promise((ok, bad) => {
        const r = new FileReader();
        r.onerror = bad;
        r.onload = () => {
          const im = new Image();
          im.onerror = bad;
          im.onload = () => {
            let w = Math.min(1000, im.width);
            for (let i = 0; i < 8; i++) {
              const c = document.createElement("canvas");
              c.width = w;
              c.height = Math.round(im.height * w / im.width);
              const x = c.getContext("2d");
              x.fillStyle = "#fff";
              x.fillRect(0, 0, c.width, c.height);
              x.drawImage(im, 0, 0, c.width, c.height);
              for (let qy = 0.85; qy >= 0.35; qy -= 0.1) {
                const d = c.toDataURL("image/jpeg", qy);
                if ((d.length - 23) * 0.75 <= max) return ok(d);
              }
              w = Math.round(w * 0.8);
            }
            bad();
          };
          im.src = r.result;
        };
        r.readAsDataURL(f);
      });
    }

              <div class="g"><small>${t("k2")}</small><b>$${k.ks}</b><span>${t("k2b")} $${k.vs}</span></div>
              <div class="w"><small>${t("k3")}</small><b>$${k.ps}</b></div>
              <div><small>${t("k4")}</small><b>${pc(k.ks, k.vs)}%</b><span>${t("k4b")} ${avgOrd}</span></div>
              <div class="r"><small>${t("k5")}</small><b>${pc(k.cn, k.n)}%</b><span>$${k.cs}</span></div>
              <div><small>${t("k6")}</small><b>${firstTs ? hm(firstTs) + "–" + hm(lastTs) : "-"}</b><span>${t("k6b")} ${peakHr ? String(peakHr[0]).padStart(2, "0") + ":00" : "-"}</span></div>
            </div>
            ${barGrp(t("bmilk"), [["OM " + t("OMs"), o => mk(o) === "OM"], ["SM " + t("SM"), o => mk(o) === "SM"], ["FM " + t("FM"), o => mk(o) === "FM"], [t("nomilk"), o => mk(o) === "-"]])}

        }
        body = `<div class="panel-box"><div class="lab" style="margin-top:0">${t("day")}</div><select onchange="fd=this.value;render()"><option value="all">${t("all")}</option>${days.map(d => `<option ${d === fd ? "selected" : ""}>${d}</option>`).join("")}</select><div class="seg">${["s", "c", "t", "k"].map(x => `<button class="${at === x ? "on" : ""}" onclick="at='${x}';render()">${t("a_" + x)}</button>`).join("")}</div></div>${subBody}`;
      } else if (mTab === "q") {
        const d = qualityOf(s.code);
        const pain = d.tags.filter(x => x.count > 0).sort((a, b) => b.lost - a.lost);
        const tr = d.trend.now != null && d.trend.prev != null ? `${d.trend.now} / ${d.trend.prev}` : "-";
        body = `<div class="card" style="text-align:center"><h3>${t("qh")}</h3>${d.n >= d.min ? `<b class="mono" style="font-size:48px">${d.avg}</b>` : `<p class="m">${tf("qlow", { n: d.n })}</p>`}<p class="m">${tf("qn_", { n: d.n })} · ${t("qrule")}</p></div>
          <div class="st"><div class="g"><small>${t("qperfect")}</small><b>${d.perfect == null ? "-" : d.perfect + "%"}</b></div><div><small>${t("qtrend")}</small><b>${tr}</b></div></div>
          <h3 style="margin-top:16px">${t("qpain")}</h3>
          ${pain.length ? pain.map(x => `<div class="ord"><h4><span>${t("q_" + x.tag)}</span><span class="tag-st">-${x.pts}</span></h4><p class="m">${tf("qlost", { c: x.count, p: x.pct, x: x.lost })}</p><p class="m">${t("tip_" + x.tag)}</p><button type="button" class="mini" style="margin-top:8px" onclick="HUB.actions.push({code:'${s.code}',ts:Date.now(),tag:'${x.tag}'});saveHub();toast(t('qfollowed'));render()">${t("qfollow")}</button></div>`).join("") : `<p class="m">${t("qnone")}</p>`}
          ${d.actions.length ? `<div class="panel-box"><h3>${t("qlog")}</h3>${d.actions.map(a => `<div class="tr"><span>${dk(a.ts)} ${t("q_" + a.tag)}</span><span>${a.before != null && a.after != null ? tf("qba", { a: a.after, b: a.before }) : t("qwait2")}</span></div>`).join("")}</div>` : ""}`;
      } else if (mTab === "m") {
        if (!md) md = JSON.parse(JSON.stringify(s.menu));
        if (!mc) mc = { ...s.cfg };
        body = `<h3>${t("m_h")}</h3>
          ${md.map((x, i) => `<div class="ord"><div class="g2"><input type="text" value="${esc(x.z)}" placeholder="${t("m_zh")}" oninput="md[${i}].z=this.value"><input type="text" value="${esc(x.e)}" placeholder="${t("m_en")}" oninput="md[${i}].e=this.value"></div>
            <div class="row" style="margin-top:8px;align-items:center">
              <input type="text" inputmode="numeric" value="${x.p}" style="width:90px;margin:0" oninput="md[${i}].p=this.value">
              <select style="width:auto;margin:0" onchange="md[${i}].g=this.value">${["hot", "iced", "spec"].map(g => `<option value="${g}" ${x.g === g ? "selected" : ""}>${t(g)}</option>`).join("")}</select>
              <label style="font-size:13px"><input type="checkbox" ${x.b ? "checked" : ""} onchange="md[${i}].b=this.checked?1:0"> ${t("m_black")}</label>
              <label style="font-size:13px"><input type="checkbox" ${x.a ? "checked" : ""} onchange="md[${i}].a=this.checked?1:0"> ${t("m_on")}</label>
              <button type="button" class="mini" onclick="md.splice(${i},1);render()">${t("m_del")}</button>
            </div></div>`).join("")}
          <button type="button" class="mini" style="margin-top:10px" onclick="md.push({id:'x'+Date.now().toString(36).slice(-5),z:'桂花拿鐵',e:'Osmanthus Latte',p:48,g:'hot',b:0,a:1});render()">${t("m_add")}</button>
          <div class="panel-box"><h3>${t("m_ex")}</h3><div class="g2">${[["L", "m_L"], ["S", "m_S"], ["om", "m_om"], ["so", "m_so"]].map(([k, l]) => `<div><small class="m">${t(l)}</small><input type="text" value="${mc[k]}" oninput="mc['${k}']=this.value"></div>`).join("")}</div></div>
          <button type="button" class="btn inline" onclick="saveMenuChanges(HUB.shops.find(x=>x.code===merchLoggedCode))">${t("m_save")}</button>`;
      } else if (mTab === "k") {
        const qsvg = buildQrSvg(linkUrl), wa = "https://wa.me/?text=" + encodeURIComponent(tf("wamsg", { n: s.name }) + " " + linkUrl);
        body = `<div class="panel-box" style="text-align:center"><h3>${t("sh1")}</h3><div class="qr">${qsvg}</div><p class="mono" style="font-size:14px"><b>${esc(linkUrl)}</b></p><div class="row" style="justify-content:center;margin-top:10px"><button type="button" class="mini" onclick="copy('${escJs(linkUrl)}')">${t("copy")}</button><a class="mini" target="_blank" rel="noopener" href="${esc(wa)}">${t("sendwa")}</a><button type="button" class="mini" onclick="saveFile('forbrew-qr-${escJs(slugDisplay(s.name))}.svg',buildQrSvg('${escJs(linkUrl)}'),'image/svg+xml')">${t("shq")}</button></div></div>`;
      } else if (mTab === "s") {
        const b = billOf(s.code), st = HUB.settings;
        body = `<div class="panel-box"><h3>${t("acct")}</h3><b style="font-size:19px">${esc(s.name)}</b><input id="af" type="tel" value="${esc(s.fps)}" placeholder="${t("fpsph")}">${pw("ap", t("newpin"))}<button type="button" class="btn inline" onclick="const sh=HUB.shops.find(x=>x.code===merchLoggedCode);sh.fps=$('#af').value.replace(/\\D/g,'');const np=$('#ap').value;if(/^\\d{8}$/.test(np))sh.pin=np;saveHub();toast(t('m_saved'));render()">${t("savebtn")}</button></div>
          <div class="panel-box"><h3>${t("stripe_h")}</h3><p class="m"><b>${s.sready ? "✅ " + t("sr") : s.stripe ? t("sl") : t("sn")}</b></p><p class="m">${tf("sfee", { a: feeFps(s), b: st.pct, c: st.fix, d: st.pct2, t: st.thr, m: st.cmin })}</p><button type="button" class="btn dark inline" onclick="const sh=HUB.shops.find(x=>x.code===merchLoggedCode);sh.stripe='acct_TEST';sh.sready=1;saveHub();toast(t('sr'));render()">${s.sready ? t("sdash") : t("sconn")}</button></div>
          <div class="card"><h3>${t("bill")}</h3><p class="m">${tf("fpsfee", { a: feeFps(s), l: st.lowp, f: st.lowf })}</p><div class="kv"><span>${t("b_o")}</span><b>${b.orders}</b></div><div class="kv"><span>${t("b_f")}</span><b>HK$${b.fees}</b></div><div class="kv"><span>${t("b_c")}</span><b>HK$${b.collected}</b></div><div class="kv"><span>${t("b_w")}</span><b>HK$${b.owed}</b></div><div class="kv"><span>${t("b_p")}</span><b>HK$${b.paid}</b></div><div class="kv"><span>${t("b_d")}</span><b>HK$${b.due}</b></div></div>
          <button type="button" class="link" onclick="merchLogOut()">${t("logout")}</button>`;
      }

      return `
        <section class="sub-band">
          <div>
            <div class="kicker">FORBREW MERCHANT CONSOLE (/)</div>
            <h1 class="band-title">${esc(s.name)}</h1>
            <p class="m">${esc(linkUrl)}</p>
          </div>
          <span class="shop-status"><span class="status-sq ${s.open ? "ok" : ""}"></span>${s.status === "suspended" ? t("e_susp") : s.open ? t("onl") : t("off")}</span>
        </section>
        <div class="console-wrap">
          <div class="seg">
            ${[["o", t("tab_o") + (np ? `<i>${np}</i>` : "")], ["a", t("tab_a")], ["q", t("tab_q")], ["m", t("tab_m")], ["k", t("tab_k")], ["s", t("tab_s")]].map(([k, lb]) =>
              `<button class="${mTab === k ? "on" : ""}" onclick="mTab='${k}';md=null;render()">${lb}</button>`
            ).join("")}
          </div>
          ${body}
        </div>`;
    }

    /* =====================================================================
       PLATFORM ADMIN CONSOLE (100% admin.html functionality)
       ===================================================================== */
    function renderAdminPage() {
      if (!admUnlocked) {
        return `
          <div class="console-wrap">
            <div class="panel-box" style="text-align:center">
              <div style="width:70px;margin:0 auto">${MASCOT}</div>
              <h1 class="band-title" style="margin-top:8px">平台後台</h1>
              <p class="m">只限平台管理員。示範密鑰：<code class="mono">adm-secret</code></p>
              ${pw("ak", "管理員密鑰（ADMIN_KEY）", 64, 0, "adm-secret")}
              <p class="m" style="color:var(--bad)">${esc(admNote)}</p>
              <button type="button" class="btn inline" onclick="if($('#ak').value.trim()==='adm-secret'){admUnlocked=true;admNote='';render();}else{admNote='管理員密鑰唔啱';render();}">登入</button>
            </div>
          </div>`;
      }

      const cfg = HUB.settings;
      const tierOf = l => l === 200 ? "new" : l === 500 ? "normal" : l === 1000 ? "trusted" : l == null ? "def" : "custom";
      const stl = s => s === "removed" ? "已移除" : s === "suspended" ? "已暫停" : "運作中";
      const hint = s => {
        const days = (Date.now() - s.created) / 864e5, b = billOf(s.code), q = qualityOf(s.code);
        if (s.lim === 200 && days >= 28 && b.due === 0 && q.n >= 30 && q.avg >= 85) return `<p class="m"><b>可考慮升二級</b>：開店滿 4 週、冇欠費、${q.n} 個評分、品質分 ${q.avg}</p>`;
        if (s.lim === 500 && days >= 84 && b.due === 0 && q.n >= 60 && q.avg >= 90) return `<p class="m"><b>可考慮升三級</b>：開店滿 12 週、冇欠費、${q.n} 個評分、品質分 ${q.avg}</p>`;
        return "";
      };

      const SORTS = {
        last: ["最近活動", (a, b) => (b._la || 0) - (a._la || 0)],
        today: ["今日單數", (a, b) => b._td - a._td],
        due: ["未繳費用", (a, b) => b._due - a._due],
        name: ["名稱", (a, b) => a.name.localeCompare(b.name, "zh")],
        new: ["最新開店", (a, b) => b.created - a.created],
        old: ["最早開店", (a, b) => a.created - b.created],
        qual: ["品質分", (a, b) => (b._qs == null ? -1 : b._qs) - (a._qs == null ? -1 : a._qs)]
      };

      const enriched = HUB.shops.map(s => {
        const b = billOf(s.code), q = qualityOf(s.code), o = HUB.orders.filter(x => x.code === s.code);
        const la = o.reduce((m, x) => Math.max(m, x.ts), 0);
        const td = o.filter(x => x.s !== "cancel" && x.s !== "unpaid" && dk(x.ts) === dk(Date.now())).length;
        return { ...s, _b: b, _due: b.due, _q: q, _qs: q.n >= 5 ? q.avg : null, _la: la, _td: td, _dpn: o.filter(x => x.dp).length, _vn: o.filter(x => x.s !== "cancel" && x.s !== "unpaid").length };
      });
      const rmN = enriched.filter(x => x.status === "removed").length;
      const list = enriched.filter(s => (showRm || s.status !== "removed") && (!qs || (s.name + " " + s.code).toLowerCase().includes(qs.toLowerCase()))).sort(SORTS[sk][1]);

      return `
        <section class="sub-band">
          <div>
            <div class="kicker">FORBREW PLATFORM ADMIN (/admin · 自含不共用代碼)</div>
            <h1 class="band-title">平台收費設定、三級欠款風控與商戶稽核</h1>
          </div>
          <button type="button" class="mini-btn" onclick="admUnlocked=false;render()">鎖定登出</button>
        </section>

        <div class="console-wrap">
          <div class="panel-box">
            <h3>收費設定（全部商戶預設）</h3>
            <div class="g2">
              <div><small class="m">每單平台費 HKD（只可以 1 至 5）</small><input id="sf" type="text" value="${cfg.fee}"></div>
              <div><small class="m">Card 固定費 HKD</small><input id="sx" type="text" value="${cfg.fix}"></div>
              <div><small class="m">Card 比例 %（單價 HK$${cfg.thr} 或以下）</small><input id="sp" type="text" value="${cfg.pct}"></div>
              <div><small class="m">Card 比例 %（超過分界）</small><input id="sp2" type="text" value="${cfg.pct2}"></div>
              <div><small class="m">比例分界單價 HKD</small><input id="st" type="text" value="${cfg.thr}"></div>
              <div><small class="m">最低價檔單價 HKD 或以下</small><input id="slp" type="text" value="${cfg.lowp}"></div>
              <div><small class="m">最低價檔轉數快費 HKD</small><input id="slf" type="text" value="${cfg.lowf}"></div>
              <div><small class="m">Card 費用下限 HKD</small><input id="scm" type="text" value="${cfg.cmin}"></div>
              <div><small class="m">全局預設欠款上限 HKD（0 = 不設）</small><input id="sl" type="text" value="${cfg.lim}"></div>
              <div><small class="m">信用卡退款是否連平台費退（0=唔退 / 1=退）</small><input id="srf" type="text" value="${cfg.refund_fee ? 1 : 0}"></div>
            </div>

            <div class="tw">
              <table>
                <tr><th>單價</th><th>轉數快 FPS</th><th>Card（平台費 + 固定 + 比例，最低 HK$${cfg.cmin}）</th></tr>
                ${[18, 45, 100, 175, 176, 200].map(x => {
                  const f = x <= cfg.lowp ? Math.min(cfg.fee, cfg.lowf) : +cfg.fee;
                  const c = Math.max(cfg.cmin, f + cfg.fix + (x <= cfg.thr ? cfg.pct : cfg.pct2) / 100 * x);
                  return `<tr><td class="mono">HK$${x}</td><td class="mono">HK$${f.toFixed(2)}</td><td class="mono">HK$${c.toFixed(2)}</td></tr>`;
                }).join("")}
              </table>
            </div>
            <p class="m">註：單價一過分界，整張單用較高比例計，所以 HK$175 同 HK$176 之間會跳一級。</p>

            <div style="margin-top:12px">
              <small class="m">商戶開店密碼。目前：<b>${cfg.open_free ? "唔需要密碼，任何人都可以開店" : "需要密碼（可撳「顯示」）"}</b></small>
              ${pw("sk", "開店密碼（最少 6 字；留空再儲存 = 唔需要密碼）", 64, 0, cfg.open_key || "")}
              <button type="button" class="mini" style="margin-top:8px" onclick="const v=$('#sk').value;if(!v){if(!armOpenFree){armOpenFree=true;toast('留空 = 唔需要密碼，再撳一次確認');return;}armOpenFree=false;HUB.settings.open_free=true;HUB.settings.open_key='';saveHub();render();return;}HUB.settings.open_free=false;HUB.settings.open_key=v;saveHub();toast('已儲存開店密碼');render()">儲存開店密碼</button>
            </div>

            <div class="g2" style="margin-top:12px">
              <button type="button" class="btn" onclick="HUB.settings={...HUB.settings,fee:Math.min(5,Math.max(1,+$('#sf').value||2)),fix:+$('#sx').value||0,pct:+$('#sp').value||3.7,pct2:+$('#sp2').value||3.9,thr:+$('#st').value||175,lowp:+$('#slp').value||18,lowf:+$('#slf').value||1,cmin:+$('#scm').value||5,lim:+$('#sl').value||0,refund_fee:+$('#srf').value?1:0};saveHub();toast('已儲存設定');render()">儲存設定</button>
              <button type="button" class="btn dark" onclick="if(!armReset){armReset=true;toast('再撳一次確認重設');return;}armReset=false;HUB.settings={fee:2,pct:3.7,pct2:3.9,fix:2,thr:175,lowp:18,lowf:1,cmin:5,lim:0,refund_fee:0,open_key:HUB.settings.open_key,open_free:HUB.settings.open_free,stripe_env:true};saveHub();toast('已重設預設');render()">全部重設為預設</button>
            </div>
          </div>

          <div class="card">
            <h3>欠款上限三級制（用意同目的）</h3>
            <p class="m"><b>一級 新店 HK$200</b>（約 3 日費用）：新店未有交易同繳費紀錄，先限制風險；萬一唔繳，損失細。</p>
            <p class="m"><b>二級 一般 HK$500</b>（約 4 日費用）：已有穩定單量同準時繳費紀錄，減少頻密繳費麻煩。</p>
            <p class="m"><b>三級 信任 HK$1,000</b>（約 5 日費用）：長期準時繳費而且品質分高，獎勵優質商戶。建議升級：二級（4 週、零欠費、30 評、85 分）；三級（12 週、零欠費、60 評、90 分）。</p>
          </div>

          <div style="margin-top:16px">
            <button type="button" class="ar" onclick="listOpen=!listOpen;render()"><span>咖啡師 ${enriched.length - rmN} 間${rmN ? "（已移除 " + rmN + "）" : ""}</span><i>${listOpen ? "▾" : "▸"}</i></button>
            ${listOpen ? `
              <div class="panel-box">
                <label style="font-size:13px;display:flex;align-items:center;gap:6px"><input type="checkbox" ${showRm ? "checked" : ""} onchange="showRm=this.checked;render()"> 顯示已移除嘅店（紀錄保留）</label>
                <input id="adm-q" type="search" placeholder="搜尋店名" value="${esc(qs)}" oninput="qs=this.value;renderAdminListRows()">
                <div class="row" style="margin-top:8px">${Object.entries(SORTS).map(([k, v]) => `<button type="button" class="chip sm${sk === k ? " on" : ""}" onclick="sk='${k}';render()">${v[0]}</button>`).join("")}</div>
                <div id="adm-list-rows">${buildAdminListRowsHtml(list, cfg, tierOf, stl, hint)}</div>
              </div>` : ""}
          </div>

          ${recShop ? (() => {
            const rs = HUB.shops.find(x => x.code === recShop), ro = HUB.orders.filter(x => x.code === recShop);
            return `<div class="panel-box"><h3>${esc(rs.name)} 完整保留紀錄（${ro.length} 單 · ${stl(rs.status)}）</h3><div class="tw"><table><tr><th>時間</th><th>單號</th><th>稱呼</th><th>電話尾 4</th><th>金額</th><th>狀態</th></tr>${ro.map(o => `<tr><td>${dk(o.ts)}</td><td>#${o.n}</td><td>${esc(o.name || "-")}</td><td>${esc(o.phone || "-")}</td><td>$${o.tot}</td><td>${o.s}</td></tr>`).join("")}</table></div></div>`;
          })() : ""}

          <div class="panel-box">
            <h3>查客戶／商戶紀錄（跨所有店，包括已移除）</h3>
            <div class="g2"><input id="q2" type="text" style="margin:0" placeholder="稱呼 或 電話尾 4 位"><button type="button" class="btn dark" onclick="const q=$('#q2').value.trim().toLowerCase();srchRows=q.length>=2?HUB.orders.filter(o=>(o.phone||'').includes(q)||(o.name||'').toLowerCase().includes(q)):[];render()">查詢</button></div>
            ${srchRows ? `<div class="tw"><table><tr><th>店鋪</th><th>單號</th><th>稱呼</th><th>尾號</th><th>金額</th><th>狀態</th></tr>${srchRows.map(o => `<tr><td>${esc(o.code)}</td><td>#${o.n}</td><td>${esc(o.name || "-")}</td><td>${esc(o.phone || "-")}</td><td>$${o.tot}</td><td>${o.s}</td></tr>`).join("")}</table></div>` : ""}
          </div>

          <div class="panel-box">
            <h3>按月結單 CSV</h3>
            <div class="g2">
              <input id="sm" type="text" style="margin:0" value="${new Date().toISOString().slice(0, 7)}">
              <button type="button" class="btn dark" onclick="csv('forbrew-statement-'+$('#sm').value+'.csv',[['店鋪','代碼','確認單數','平台費用 HKD']].concat(HUB.shops.map(sh=>[sh.name,sh.code,HUB.fees.filter(f=>f.code===sh.code).length,billOf(sh.code).fees])))">匯出結單 CSV</button>
            </div>
          </div>
        </div>`;
    }

    function buildAdminListRowsHtml(list, cfg, tierOf, stl, hint) {

      });
      const list = enriched.filter(s => (showRm || s.status !== "removed") && (!qs || (s.name + " " + s.code).toLowerCase().includes(qs.toLowerCase()))).sort(SORTS[sk] || SORTS.last);

  <!-- =====================================================================
       THREE.JS r165 INTERACTIVE COFFEE BOOKSHELF ENGINE
       Every coffee drink on the Forbrew menu is rendered as a selectable 3D book!

  <script type="module">
    import * as THREE from "three";
    import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

    const GROUP_PALETTES = {
      hot: ["#D97757", "#B85C3E", "#8C4A32", "#A65336", "#703824"],
      iced: ["#2F8F5B", "#266D53", "#3D736E", "#465362"],
      spec: ["#272624", "#7A5C3E"]
    };

    let renderer, scene, camera, envRT, pmrem, ro;
    let rafId = 0, alive = false, focused = true;
    let selectedDrinkId = "", hoveredIdx = -1;
    let booksGroup = null;
    const bookNodes = [];
    const hitMeshes = [];
    const sceneDisposables = [];
    const bookDisposables = [];
    let currentWrap = null;

    function detectSoftwareGl(gl) {
      try {
        const dbg = gl.getExtension("WEBGL_debug_renderer_info");
        if (!dbg) return false;
        return /swiftshader|llvmpipe|software/i.test(String(gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) || ""));
      } catch {
        return false;
      }
    }

    function makeCoffeeBookTex(drink, idx, colorHex, isCover) {
      const cvs = document.createElement("canvas");
      cvs.width = isCover ? 480 : 144;
      cvs.height = 720;
      const g = cvs.getContext("2d");

      g.fillStyle = colorHex;
      g.fillRect(0, 0, cvs.width, cvs.height);

      // Subtle bookcloth grain
      g.fillStyle = "rgba(255,255,255,0.04)";
      for (let y = 0; y < cvs.height; y += 5) g.fillRect(0, y, cvs.width, 1);

      const accent = "#FAF7F2";
      g.strokeStyle = accent;
      g.lineWidth = isCover ? 4 : 3;
      g.strokeRect(isCover ? 22 : 12, 22, cvs.width - (isCover ? 44 : 24), cvs.height - 44);

      const grpName = drink.g === "hot" ? "HOT" : drink.g === "iced" ? "ICED" : "SPECIAL";
      const labelTitle = window.lang === "en" ? (drink.e || drink.z) : (drink.z || drink.e);
      const labelSub = window.lang === "en" ? (drink.z || "") : (drink.e || "");

      if (isCover) {
        g.fillStyle = accent;
        g.font = "bold 24px monospace";
        g.fillText("FORBREW · NO." + String(idx + 1).padStart(2, "0") + " · " + grpName, 40, 76);

        g.font = "bold 46px 'Noto Serif TC', Georgia, serif";
        g.fillText(labelTitle, 40, 158, 400);

        g.globalAlpha = 0.85;
        g.font = "bold 22px Georgia, serif";
        g.fillText(labelSub, 40, 204, 400);
        g.globalAlpha = 1;

        // Price frame
        g.strokeStyle = accent;
        g.lineWidth = 3;
        g.strokeRect(40, 290, 400, 250);
        g.textAlign = "center";
        g.font = "bold 88px Georgia, serif";
        g.fillText("$" + drink.p, 240, 435);
        g.font = "bold 22px monospace";
        g.fillText(drink.b ? "BLACK COFFEE" : "MILK OPTIONAL", 240, 495);
        g.textAlign = "left";
      } else {
        g.fillStyle = accent;
        g.textAlign = "center";
        g.font = "bold 28px monospace";
        g.fillText(String(idx + 1).padStart(2, "0"), cvs.width / 2, 74);

        g.save();
        g.translate(cvs.width / 2, 360);
        g.rotate(-Math.PI / 2);
        g.font = "bold 28px 'Noto Sans TC', sans-serif";
        g.fillText(labelTitle + "  $" + drink.p, 0, 10, 440);
        g.restore();

        g.font = "bold 18px monospace";
        g.fillText(grpName, cvs.width / 2, 672);
      }

      const tex = new THREE.CanvasTexture(cvs);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = 4;
      bookDisposables.push(tex);
      return tex;
    }

    function clearBooks() {
      if (!booksGroup) return;
      while (booksGroup.children.length) booksGroup.remove(booksGroup.children[0]);
      bookNodes.length = 0;
      hitMeshes.length = 0;
      bookDisposables.forEach(d => d && typeof d.dispose === "function" && d.dispose());
      bookDisposables.length = 0;
    }

    let endLMesh = null, endRMesh = null, shelfHalfSpan = 2.9;

    function buildBooksOnShelf(drinks, activeId) {
      if (!booksGroup) return;
      clearBooks();
      const list = Array.isArray(drinks) ? drinks : [];
      selectedDrinkId = activeId || (list[0] && list[0].id) || "";
      if (!list.length) {
        if (window.__shelfRequest) window.__shelfRequest();
        return;
      }

      const paperMat = new THREE.MeshStandardMaterial({ color: 0xF5EFE2, roughness: 0.9, metalness: 0 });
      const hitMat = new THREE.MeshBasicMaterial({ visible: false });
      bookDisposables.push(paperMat, hitMat);

      const n = list.length;
      const bookW = n > 8 ? 0.36 : 0.44;
      const gap = n > 8 ? 0.08 : 0.14;
      const totalW = n * bookW + (n - 1) * gap;
      shelfHalfSpan = Math.max(2.9, totalW / 2 + 0.34);
      if (endLMesh) endLMesh.position.x = -shelfHalfSpan;
      if (endRMesh) endRMesh.position.x = shelfHalfSpan;
      let cursorX = -totalW / 2 + bookW / 2;

      const counters = { hot: 0, iced: 0, spec: 0 };
      list.forEach((drink, idx) => {
        const pal = GROUP_PALETTES[drink.g] || GROUP_PALETTES.hot;
        const cIdx = counters[drink.g] || 0;
        counters[drink.g] = cIdx + 1;
        const colorHex = pal[cIdx % pal.length];

        const hBook = 2.25 + ((idx % 3) * 0.08);
        const depth = 1.42;

        const coverTex = makeCoffeeBookTex(drink, idx, colorHex, true);
        const spineTex = makeCoffeeBookTex(drink, idx, colorHex, false);

        const coverMat = new THREE.MeshStandardMaterial({ map: coverTex, roughness: 0.78, metalness: 0.06 });
        const spineMat = new THREE.MeshStandardMaterial({ map: spineTex, roughness: 0.72, metalness: 0.08 });
        const clothMat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.82, metalness: 0.04 });
        bookDisposables.push(coverMat, spineMat, clothMat);

        const boardGeo = new THREE.BoxGeometry(0.04, hBook, depth);
        const spineGeo = new THREE.BoxGeometry(bookW, hBook, 0.045);
        const pageGeo = new THREE.BoxGeometry(bookW - 0.075, hBook - 0.08, depth - 0.06);
        const hitGeo = new THREE.BoxGeometry(bookW + gap * 0.9, hBook + 0.14, depth + 0.14);
        bookDisposables.push(boardGeo, spineGeo, pageGeo, hitGeo);

        const gBook = new THREE.Group();
        const front = new THREE.Mesh(boardGeo, coverMat);
        front.position.set(bookW / 2 - 0.02, hBook / 2, 0);
        front.castShadow = true;

        const back = new THREE.Mesh(boardGeo, clothMat);
        back.position.set(-bookW / 2 + 0.02, hBook / 2, 0);
        back.castShadow = true;

        const spine = new THREE.Mesh(spineGeo, spineMat);
        spine.position.set(0, hBook / 2, depth / 2 - 0.022);
        spine.castShadow = true;

        const pages = new THREE.Mesh(pageGeo, paperMat);
        pages.position.set(0, hBook / 2, -0.02);

        const hit = new THREE.Mesh(hitGeo, hitMat);
        hit.position.set(0, hBook / 2, 0);
        hit.userData = { idx, drinkId: drink.id };

        gBook.add(front, back, spine, pages, hit);
        gBook.position.set(cursorX, 0, 0);
        gBook.userData = { baseX: cursorX, drinkId: drink.id, curZ: 0, curY: 0, curRotY: 0 };

        cursorX += bookW + gap;
        booksGroup.add(gBook);
        bookNodes.push(gBook);
        hitMeshes.push(hit);
      });

      if (window.__shelfRequest) window.__shelfRequest();
    }

    function disposeEngine() {
      alive = false;
      if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
      if (ro) { ro.disconnect(); ro = null; }
      clearBooks();
      sceneDisposables.forEach(d => d && typeof d.dispose === "function" && d.dispose());
      sceneDisposables.length = 0;
      if (envRT) { envRT.dispose(); envRT = null; }
      if (renderer) { renderer.dispose(); if (renderer.domElement && renderer.domElement.parentNode) renderer.domElement.remove(); renderer = null; }
      booksGroup = null;
      currentWrap = null;
    }

    window.__shelfDispose = disposeEngine;

    window.__shelfMount = (drinks, activeId) => {
      const wrap = document.getElementById("canvas-wrap");
      const fallbackEl = document.getElementById("webgl-fallback");
      if (!wrap) return;
      if (currentWrap === wrap && renderer) {
        buildBooksOnShelf(drinks, activeId);
        return;
      }
      disposeEngine();
      currentWrap = wrap;
      const prefersReducedMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      try {
        renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
      } catch {

        return;
      }

      const sw = detectSoftwareGl(renderer.getContext());
      const w = wrap.clientWidth || 640, h = wrap.clientHeight || 420;
      renderer.setPixelRatio(sw ? 1 : Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(w, h);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.04;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      wrap.appendChild(renderer.domElement);

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0xF2ECE1);
      scene.fog = new THREE.FogExp2(0xF2ECE1, 0.032);

      camera = new THREE.PerspectiveCamera(38, w / h, 0.1, 40);
      camera.position.set(0.25, 1.9, 8.2);
      camera.lookAt(0, 1.05, 0);

      pmrem = new THREE.PMREMGenerator(renderer);
      envRT = pmrem.fromScene(new RoomEnvironment(), 0.04);
      scene.environment = envRT.texture;
      scene.environmentIntensity = 0.72;
      pmrem.dispose();

      scene.add(new THREE.HemisphereLight(0xF4F7FA, 0xA89B8C, 0.68));
      const key = new THREE.DirectionalLight(0xFFF3E2, 2.05);
      key.position.set(4.5, 6.5, 5.8);
      key.castShadow = true;
      key.shadow.mapSize.set(sw ? 512 : 1024, sw ? 512 : 1024);
      key.shadow.camera.near = 1; key.shadow.camera.far = 22;
      key.shadow.camera.left = -6; key.shadow.camera.right = 6;
      key.shadow.camera.top = 5; key.shadow.camera.bottom = -2;
      key.shadow.bias = -0.0005; key.shadow.normalBias = 0.02;
      scene.add(key);

      const rim = new THREE.DirectionalLight(0xFFE6D0, 0.85);
      rim.position.set(-4.5, 3.8, -4.2);
      scene.add(rim);

      // Walnut Shelf + Backplate + Sculpted Brass Bookends
      const shelfGrp = new THREE.Group();
      const walMat = new THREE.MeshStandardMaterial({ color: 0x4A3628, roughness: 0.68, metalness: 0.04 });
      const plankGeo = new THREE.BoxGeometry(10.2, 0.24, 2.6);
      const plank = new THREE.Mesh(plankGeo, walMat);
      plank.position.set(0, -0.12, 0.25);
      plank.receiveShadow = true;

      const brassMat = new THREE.MeshStandardMaterial({ color: 0xC6A267, roughness: 0.28, metalness: 0.8 });
      const railGeo = new THREE.BoxGeometry(10.2, 0.035, 0.04);
      const rail = new THREE.Mesh(railGeo, brassMat);
      rail.position.set(0, 0.018, 1.5);

      const backGeo = new THREE.BoxGeometry(10.2, 3.8, 0.16);
      const backMat = new THREE.MeshStandardMaterial({ color: 0xEAE1D2, roughness: 0.88, metalness: 0 });
      const back = new THREE.Mesh(backGeo, backMat);
      back.position.set(0, 1.65, -1.05);
      back.receiveShadow = true;

      const endGeo = new THREE.BoxGeometry(0.11, 1.5, 1.25);
      const endL = new THREE.Mesh(endGeo, brassMat); endL.position.set(-2.9, 0.75, 0); endL.castShadow = true;
      const endR = new THREE.Mesh(endGeo, brassMat); endR.position.set(2.9, 0.75, 0); endR.castShadow = true;
      endLMesh = endL; endRMesh = endR;

      shelfGrp.add(plank, rail, back, endL, endR);
      sceneDisposables.push(walMat, plankGeo, brassMat, railGeo, backGeo, backMat, endGeo);
      scene.add(shelfGrp);

      booksGroup = new THREE.Group();
      scene.add(booksGroup);

      alive = true;
      focused = true;
      const raycaster = new THREE.Raycaster(), ptr = new THREE.Vector2();
      let lastTs = performance.now();

      function requestRender() {
        if (!alive || rafId) return;
        rafId = requestAnimationFrame(tick);
      }
      window.__shelfRequest = requestRender;
      window.__shelfSelectDrink = id => { selectedDrinkId = id; focused = true; requestRender(); };
      window.__shelfRelax = () => { focused = false; requestRender(); };
      window.__shelfRebuildBooks = (nextDrinks, nextId) => { buildBooksOnShelf(nextDrinks, nextId); };

      function tick(now) {
        rafId = 0;
        if (!alive || !renderer) return;
        const dt = Math.min(0.05, (now - lastTs) / 1000);
        lastTs = now;
        let settled = true;
        const rate = prefersReducedMotion ? 1 : 9.5;

        let targetCamX = 0.18, targetLookX = 0;
        bookNodes.forEach((g, idx) => {
          const isSel = focused && g.userData.drinkId === selectedDrinkId;
          const isHov = idx === hoveredIdx && !isSel;
          if (isSel) {
            targetCamX = g.userData.baseX * 0.45;
            targetLookX = g.userData.baseX * 0.55;
          }
          const tZ = isSel ? 1.28 : isHov ? 0.22 : 0;
          const tY = isSel ? 0.14 : isHov ? 0.04 : 0;
          const tRot = isSel ? -0.42 : isHov ? -0.05 : 0;

          if (prefersReducedMotion) {
            g.userData.curZ = tZ; g.userData.curY = tY; g.userData.curRotY = tRot;
          } else {
            g.userData.curZ = THREE.MathUtils.damp(g.userData.curZ, tZ, rate, dt);
            g.userData.curY = THREE.MathUtils.damp(g.userData.curY, tY, rate, dt);
            g.userData.curRotY = THREE.MathUtils.damp(g.userData.curRotY, tRot, rate, dt);
          }
          g.position.z = g.userData.curZ;
          g.position.y = g.userData.curY;
          g.rotation.y = g.userData.curRotY;

          if (Math.abs(g.userData.curZ - tZ) > 0.0005 || Math.abs(g.userData.curY - tY) > 0.0005 || Math.abs(g.userData.curRotY - tRot) > 0.0005) {
            settled = false;
          }
        });

        const baseZ = Math.max(8.2, shelfHalfSpan * 2.5);
        const targetCamZ = focused ? Math.max(7.35, baseZ - 0.85) : baseZ;
        if (!prefersReducedMotion) {
          camera.position.x = THREE.MathUtils.damp(camera.position.x, targetCamX, 7.5, dt);
          camera.position.z = THREE.MathUtils.damp(camera.position.z, targetCamZ, 7.5, dt);
        } else {
          camera.position.x = targetCamX; camera.position.z = targetCamZ;
        }
        camera.lookAt(targetLookX, 1.05, 0);

        if (Math.abs(camera.position.x - targetCamX) > 0.0006 || Math.abs(camera.position.z - targetCamZ) > 0.0006) settled = false;

        renderer.render(scene, camera);
        if (!settled && !prefersReducedMotion) requestRender();
      }

      const pickAt = e => {
        const rect = renderer.domElement.getBoundingClientRect();
        ptr.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
        ptr.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
        raycaster.setFromCamera(ptr, camera);
        const hits = raycaster.intersectObjects(hitMeshes, false);
        return hits.length ? hits[0].object.userData : null;
      };

      renderer.domElement.addEventListener("pointermove", e => {
        const h = pickAt(e), ni = h ? h.idx : -1;
        if (ni !== hoveredIdx) {
          hoveredIdx = ni;
          wrap.style.cursor = ni >= 0 ? "pointer" : "grab";
          requestRender();
        }
      });
      renderer.domElement.addEventListener("click", e => {
        const h = pickAt(e);
        if (h && window.pickDrinkFromShelf) window.pickDrinkFromShelf(h.drinkId);
      });
      renderer.domElement.addEventListener("webglcontextlost", e => {
        e.preventDefault();
        if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
        if (fallbackEl) fallbackEl.classList.add("on");
      });
      renderer.domElement.addEventListener("webglcontextrestored", () => {
        if (fallbackEl) fallbackEl.classList.remove("on");
        requestRender();
      });

      ro = new ResizeObserver(entries => {
        const cr = entries[0] && entries[0].contentRect;
        if (!cr || cr.width < 10 || cr.height < 10 || !renderer) return;
        camera.aspect = cr.width / cr.height;
        camera.updateProjectionMatrix();
        renderer.setSize(cr.width, cr.height);
        requestRender();
      });
      ro.observe(wrap);

      buildBooksOnShelf(drinks, activeId);
    };

    window.addEventListener("pagehide", disposeEngine);

    // Mount immediately on first load if customer page is active
    if (document.getElementById("canvas-wrap") && window.filteredBooks && window.curShop) {
      window.__shelfMount(window.filteredBooks(window.curShop()), window.sel.drink);
    }
  </script>
</body>
</html>
