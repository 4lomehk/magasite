<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forbrew 3D Strategy World</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: monospace; }
    body { background-color: #0f0f0f; color: #fff; overflow: hidden; }
    #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; }
    
    /* UI Overlay System */
    .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
    .interactive { pointer-events: auto; }
    
    /* Login Modal */
    #login-box {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 360px; background: #181818; border: 1px solid #333; border-radius: 12px;
      padding: 24px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.8);
    }
    .logo { width: 48px; height: 48px; background: #e07a5f; margin: 0 auto 16px; clip-path: polygon(20% 0%, 80% 0%, 100% 40%, 80% 100%, 20% 100%, 0% 40%); }
    input { width: 100%; padding: 12px; margin: 8px 0; background: #0a0a0a; border: 1px solid #444; border-radius: 6px; color: #fff; }
    button { width: 100%; padding: 14px; background: #e07a5f; border: none; border-radius: 6px; color: #fff; font-weight: bold; cursor: pointer; margin-top: 12px; }
    button:hover { background: #d0694e; }
    
    /* HUD Overlay Panels */
    #hud { display: none; padding: 20px; }
    .status-card { background: rgba(24, 24, 24, 0.85); backdrop-filter: blur(8px); padding: 16px; border-radius: 8px; border: 1px solid #444; width: 280px; }
    .node-title { color: #e07a5f; font-size: 18px; margin-bottom: 8px; border-bottom: 1px solid #333; padding-bottom: 4px; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <div class="overlay">
    <!-- 登入介面 (Forbrew Auth) -->
    <div id="login-box" class="interactive">
      <div class="logo"></div>
      <h2>Forbrew</h2>
      <p style="color: #888; font-size: 12px; margin: 8px 0 16px;">商戶專用。店名加 8 位數字 PIN 登入 3D 戰略世界。</p>
      <input type="text" id="shop-name" placeholder="店名 (例如: TEAM A)">
      <input type="password" id="pin-code" placeholder="8 位數字 PIN" maxlength="8">
      <button onclick="bootStrategyWorld()">登入 / 載入世界</button>
    </div>

    <!-- 遊戲抬頭顯示器 (HUD) -->
    <div id="hud">
      <div class="status-card interactive">
        <div class="node-title" id="node-name">選取機器組件</div>
        <p id="node-desc">點擊 3D 咖啡機組件以查看運作數據與升級策略。</p>
        <div style="margin-top: 12px; font-size: 12px; color: #aaa;">
          <div>氣壓: <span id="bar-val" style="color:#fff;">9.1 BAR</span></div>
          <div>水溫: <span id="temp-val" style="color:#fff;">93.0 °C</span></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let scene, camera, renderer, raycaster, mouse;
    let interactiveObjects = [];

    function init3DWorld() {
      const container = document.getElementById('canvas-container');
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0f0f0f);

      // 正交投影相機 (Isometric View)
      const aspect = window.innerWidth / window.innerHeight;
      const d = 5;
      camera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, 1, 1000);
      camera.position.set(10, 10, 10);
      camera.lookAt(0, 0, 0);

      // 燈光設定
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
      scene.add(ambientLight);
      const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
      dirLight.position.set(15, 20, 10);
      scene.add(dirLight);

      // 網格底盤 (Strategy Grid Base)
      const gridHelper = new THREE.GridHelper(10, 10, 0x444444, 0x222222);
      scene.add(gridHelper);

      // 咖啡機主體 (Base Body)
      const bodyGeo = new THREE.BoxGeometry(3, 3.5, 2.5);
      const bodyMat = new THREE.MeshStandardMaterial({ color: 0xdddddd });
      const machineBody = new THREE.Mesh(bodyGeo, bodyMat);
      machineBody.position.set(0, 1.75, 0);
      scene.add(machineBody);

      // 點擊組件 1: Boiler (水鍋爐)
      const boilerGeo = new THREE.CylinderGeometry(0.4, 0.4, 1, 16);
      const boilerMat = new THREE.MeshStandardMaterial({ color: 0xe07a5f });
      const boiler = new THREE.Mesh(boilerGeo, boilerMat);
      boiler.position.set(-0.8, 4, -0.5);
      boiler.name = "Boiler (水鍋爐)";
      boiler.userData = { desc: "提供穩定熱水與蒸氣。升級可提升水溫控制精度力。", temp: "93.4 °C", bar: "1.2 BAR" };
      scene.add(boiler);
      interactiveObjects.push(boiler);

      // 點擊組件 2: Group Head (萃取頭)
      const headGeo = new THREE.BoxGeometry(0.8, 0.5, 0.8);
      const headMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
      const groupHead = new THREE.Mesh(headGeo, headMat);
      groupHead.position.set(0, 1.5, 1.4);
      groupHead.name = "Group Head (萃取頭)";
      groupHead.userData = { desc: "高壓水流注入咖啡粉層核心，掌控流速與風味萃取。", temp: "93.0 °C", bar: "9.1 BAR" };
      scene.add(headGeo ? groupHead : null);
      interactiveObjects.push(groupHead);

      // Raycaster 偵測
      raycaster = new THREE.Raycaster();
      mouse = new THREE.Vector2();

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      container.appendChild(renderer.domElement);

      window.addEventListener('click', onDocumentOptionClick, false);
      animate();
    }

    function bootStrategyWorld() {
      const pin = document.getElementById('pin-code').value;
      if (pin.length !== 8) {
        alert('請輸入 8 位數字 PIN');
        return;
      }
      document.getElementById('login-box').style.display = 'none';
      document.getElementById('hud').style.display = 'block';
      init3DWorld();
    }

    function onDocumentOptionClick(event) {
      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(interactiveObjects);

      if (intersects.length > 0) {
        const obj = intersects[0].object;
        document.getElementById('node-name').innerText = obj.name;
        document.getElementById('node-desc').innerText = obj.userData.desc;
        document.getElementById('temp-val').innerText = obj.userData.temp;
        document.getElementById('bar-val').innerText = obj.userData.bar;
      }
    }

    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
