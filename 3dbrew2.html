<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Forbrew · 滾動咖啡分層鑑賞與即時落單</title>
  <meta name="description" content="Forbrew 電影級滾動產品展示與咖啡落單系統：實拍雙層玻璃杯分層解剖（奶泡、濃縮、蒸氣鮮奶）、S/M/L 份量即時換算、轉數快 99KB 收據與三角色控制台。" />
  <meta name="theme-color" content="#0F0F0F" />
  <meta property="og:title" content="Forbrew · 滾動咖啡分層鑑賞與即時落單" />
  <meta property="og:description" content="Forbrew 電影級滾動產品展示與咖啡落單系統：實拍玻璃杯分層解剖與即時落單。" />
  <meta property="og:type" content="website" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=JetBrains+Mono:wght@500;700&family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@500;700;900&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f0f;
      --surface: #171614;
      --surface-2: #1f1d1a;
      --fg: #f5efe6;
      --mut: #a39a8c;
      --line: #2b2722;
      --acc: #d4956a;
      --acc-ink: #12100e;
      --ok: #3ea870;
      --warn: #e8a317;
      --bad: #e05246;
      --foam: #f4ede2;
      --espresso: #5b3118;
      --milk: #dfd0ba;
      --water: #8d684c;
      --serif: "Cormorant Garamond", "Noto Serif TC", Georgia, serif;
      --sans: "Plus Jakarta Sans", "Noto Sans TC", "PingFang HK", system-ui, sans-serif;
      --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, monospace;
      color-scheme: dark;
    }

    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: var(--sans);
      font-size: 15px;
      line-height: 1.6;
      letter-spacing: 0.01em;
      -webkit-font-smoothing: antialiased;
      padding-bottom: 56px;
    }

    /* =====================================================================
       TOP BAR CONTRACT (3 zones: Wordmark — Single-line Nav — Utility)
       ===================================================================== */
    .masthead {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(15, 15, 15, 0.94);
      border-bottom: 1px solid var(--line);
    }
    .masthead-in {
      max-width: 1360px;
      margin: 0 auto;
      padding: 0 24px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }
    .brand {
      font-family: var(--serif);
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0.03em;
      color: var(--fg);
      text-decoration: none;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .top-links {
      display: flex;
      align-items: center;
      gap: 18px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .top-links::-webkit-scrollbar { display: none; }
    .top-link {
      background: none;
      border: 0;
      border-bottom: 1px solid transparent;
      color: var(--mut);
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      padding: 6px 2px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: color 0.16s, border-color 0.16s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .top-link:hover { color: var(--fg); }
    .top-link.on { color: var(--fg); border-bottom-color: var(--acc); }
    .top-link .cnt {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--warn);
      font-variant-numeric: tabular-nums;
    }
    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    .mini-btn {
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--fg);
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: border-color 0.16s, background-color 0.16s;
    }
    .mini-btn:hover { border-color: var(--acc); background: var(--surface-2); }
    .cta-top {
      border: 0;
      background: var(--acc);
      color: var(--acc-ink);
      font: inherit;
      font-size: 12px;
      font-weight: 800;
      padding: 7px 14px;
      border-radius: 4px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* =====================================================================
       CINEMATIC SCROLL-CONTROLLED PRODUCT HERO (TMV 4-Act Choreography)
       ===================================================================== */
    .scroll-hero {
      position: relative;
      height: 290vh;
      background: var(--bg);
      border-bottom: 1px solid var(--line);
    }
    .hero-sticky {
      position: sticky;
      top: 56px;
      height: calc(100vh - 56px);
      min-height: 600px;
      max-width: 1360px;
      margin: 0 auto;
      padding: 18px 24px 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }
    .hero-hud {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
      flex-shrink: 0;
    }
    .act-tabs {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .act-btn {
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--mut);
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 700;
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: border-color 0.16s, color 0.16s, background-color 0.16s;
    }
    .act-btn.on {
      border-color: var(--acc);
      background: var(--acc);
      color: var(--acc-ink);
    }
    .progress-track {
      flex: 1;
      max-width: 260px;
      height: 2px;
      background: var(--line);
      position: relative;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 100%;
      background: var(--acc);
      transform-origin: left center;
      transform: scaleX(0);
    }

    .hero-grid {
      flex: 1;
      display: grid;
      grid-template-columns: 1.05fr 1fr;
      gap: 32px;
      align-items: center;
      min-height: 0;
      padding: 12px 0;
    }
    .hero-copy {
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-width: 0;
    }
    .hero-act-label {
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 700;
      color: var(--acc);
      letter-spacing: 0.06em;
    }
    .hero-title {
      font-family: var(--serif);
      font-size: clamp(2.1rem, 3.8vw, 3.6rem);
      font-weight: 700;
      line-height: 1.08;
      text-wrap: balance;
      color: var(--fg);
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    .hero-desc {
      font-size: 15px;
      color: var(--mut);
      max-width: 58ch;
      line-height: 1.65;
    }

    /* Quick Coffee Switcher & Volume Control inside Hero */
    .hero-cup-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding-top: 4px;
    }
    .cup-tab {
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--mut);
      font: inherit;
      font-size: 12px;
      font-weight: 700;
      padding: 6px 11px;
      border-radius: 4px;
      cursor: pointer;
      white-space: nowrap;
      transition: border-color 0.15s, color 0.15s, background-color 0.15s;
    }
    .cup-tab:hover { border-color: var(--fg); color: var(--fg); }
    .cup-tab.on { border-color: var(--acc); background: var(--acc); color: var(--acc-ink); }

    /* Live Layer & Volume Proportion Card inside Hero */
    .hero-layer-panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .layer-panel-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 10px;
      border-bottom: 1px solid var(--line);
      padding-bottom: 8px;
    }
    .layer-panel-head strong {
      font-size: 13px;
      font-weight: 800;
      color: var(--fg);
    }
    .layer-panel-head span {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--acc);
      font-variant-numeric: tabular-nums;
    }
    .layer-row {
      display: grid;
      grid-template-columns: 12px 1.25fr 84px 1fr;
      align-items: center;
      gap: 10px;
      font-size: 13px;
    }
    .layer-swatch { width: 10px; height: 10px; border-radius: 2px; border: 1px solid rgba(255,255,255,0.22); }
    .layer-name { font-weight: 700; color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .layer-name small { display: block; font-size: 11px; font-weight: 500; color: var(--mut); }
    .layer-vol { font-family: var(--mono); font-size: 12px; font-weight: 700; color: var(--fg); text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .layer-meter { height: 7px; background: var(--surface-2); border-radius: 2px; overflow: hidden; }
    .layer-meter i { display: block; height: 100%; border-radius: 2px; transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1); transform-origin: left center; }

    /* Pinned Product Vitrine (Uploaded Studio Photo + Anatomical Callout Pins) */
    .vitrine-stage {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 20px;
      height: clamp(390px, 60vh, 520px);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .vitrine-plate {
      position: relative;
      width: 100%;
      height: 100%;
      background: #ffffff;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      will-change: transform, filter, opacity;
    }
    .vitrine-img {
      width: 82%;
      height: 82%;
      object-fit: contain;
      display: block;
      transition: opacity 0.22s ease, transform 0.28s cubic-bezier(0.16, 1, 0.3, 1);
      user-select: none;
      -webkit-user-drag: none;
    }
    .vitrine-img-fallback {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #141413;
      text-align: center;
      padding: 20px;
      gap: 8px;
    }
    .vitrine-img-fallback.on { display: flex; }

    /* Anatomical Layer Leader Callouts anchored to Cup Levels */
    .callout-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      transition: opacity 0.28s ease;
    }
    .callout-pin {
      position: absolute;
      right: 12px;
      transform: translateY(-50%);
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(15, 15, 15, 0.9);
      border: 1px solid #35302a;
      color: var(--fg);
      padding: 5px 10px;
      border-radius: 4px;
      font-size: 11px;
      font-family: var(--mono);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .callout-pin::before {
      content: "";
      width: 44px;
      height: 1px;
      background: var(--acc);
      position: absolute;
      right: 100%;
      top: 50%;
    }
    .callout-pin b { color: var(--acc); font-weight: 700; }

    .hero-foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      border-top: 1px solid var(--line);
      padding-top: 10px;
      font-size: 12px;
      color: var(--mut);
      flex-shrink: 0;
    }

    /* =====================================================================
       MAIN FORBREW WORKSPACE & ORDER STUDIO
       ===================================================================== */
    .shell { max-width: 1360px; margin: 0 auto; padding: 0 24px; }

    .sub-band {
      padding: 28px 0 18px;
      border-bottom: 1px solid var(--line);
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
    }
    .route-trail {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--mut);
      margin-bottom: 6px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .band-title {
      font-family: var(--serif);
      font-size: clamp(1.75rem, 2.8vw, 2.5rem);
      font-weight: 700;
      line-height: 1.15;
      color: var(--fg);
    }
    .shop-status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 700;
      border: 1px solid var(--line);
      background: var(--surface);
      padding: 7px 14px;
      border-radius: 4px;
      white-space: nowrap;
    }

    /* Order Studio 2-Column Balanced Split */
    .studio-grid {
      display: grid;
      grid-template-columns: 1.18fr 1fr;
      gap: 28px;
      padding: 24px 0 40px;
      align-items: stretch;
    }
    .visual-panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .grp-tabs { display: flex; flex-wrap: wrap; gap: 6px; }
    .grp-btn {
      border: 1px solid var(--line);
      background: var(--surface-2);
      color: var(--mut);
      font: inherit;
      font-size: 12px;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      white-space: nowrap;
    }
    .grp-btn.on { background: var(--acc); border-color: var(--acc); color: var(--acc-ink); }

    /* Visual Photo Specimen Showcase inside Order Studio */
    .specimen-box {
      position: relative;
      background: #ffffff;
      border-radius: 6px;
      height: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .specimen-box img {
      width: 82%;
      height: 86%;
      object-fit: contain;
      display: block;
    }

    /* Uploaded Photo Drink Selector Grid */
    .drink-gallery {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .drink-card {
      border: 1px solid var(--line);
      background: var(--surface-2);
      color: var(--fg);
      border-radius: 6px;
      padding: 10px;
      cursor: pointer;
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: border-color 0.16s, transform 0.16s;
    }
    .drink-card:hover { border-color: var(--mut); transform: translateY(-2px); }
    .drink-card.on { border-color: var(--acc); background: #26211c; }
    .drink-thumb {
      width: 100%;
      aspect-ratio: 4 / 3;
      background: #ffffff;
      border-radius: 4px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .drink-thumb img { width: 88%; height: 88%; object-fit: contain; display: block; }
    .drink-card-title { font-size: 13px; font-weight: 800; color: var(--fg); line-height: 1.25; }
    .drink-card-meta {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--mut);
      font-variant-numeric: tabular-nums;
    }
    .drink-card.on .drink-card-meta b { color: var(--acc); }

    /* Live Cross-Section Ratio Stack */
    .ratio-stack-bar {
      height: 14px;
      border-radius: 3px;
      overflow: hidden;
      display: flex;
      gap: 2px;
      background: var(--bg);
      margin-top: 6px;
    }
    .ratio-seg { height: 100%; transition: width 0.24s ease; }

    /* Right Order Desk */
    .order-desk {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 16px;
    }
    .prog { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .prog div {
      border: 1px solid var(--line);
      background: var(--surface-2);
      text-align: center;
      font-size: 12px;
      font-weight: 700;
      color: var(--mut);
      padding: 8px 4px;
      border-radius: 4px;
    }
    .prog div b {
      display: block;
      font-family: var(--mono);
      font-size: 15px;
      margin-bottom: 2px;
    }
    .prog div.on { background: var(--acc); border-color: var(--acc); color: var(--acc-ink); }

    @keyframes billDropIn {
      0% { opacity: 0; transform: translateY(-32px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes floatUpIn {
      0% { opacity: 0; transform: translateY(32px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .bill-drop { animation: billDropIn 0.36s cubic-bezier(0.16, 1, 0.3, 1) both; }
    .rate-float { animation: floatUpIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) both; }

    /* Controls & Tables (Dark Obsidian High Contrast) */
    .lab {
      font-size: 12px;
      color: var(--mut);
      margin: 12px 0 6px;
      font-weight: 700;
    }
    .g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .row { display: flex; flex-wrap: wrap; gap: 7px; }
    .chip {
      border: 1px solid var(--line);
      background: var(--surface-2);
      color: var(--fg);
      border-radius: 4px;
      padding: 9px 12px;
      font: inherit;
      font-weight: 700;
      font-size: 13px;
      min-height: 42px;
      cursor: pointer;
      text-align: left;
      transition: border-color 0.15s, background-color 0.15s;
    }
    .chip:hover:not(:disabled) { border-color: var(--mut); }
    .chip:disabled { opacity: 0.42; cursor: not-allowed; }
    .chip.on { background: var(--acc); border-color: var(--acc); color: var(--acc-ink); }
    .chip small { display: block; font-family: var(--mono); font-size: 11px; opacity: 0.85; font-variant-numeric: tabular-nums; }
    .chip.sm { padding: 6px 10px; min-height: 36px; font-size: 12px; }

    .qty { display: flex; align-items: center; gap: 12px; }
    .qty button {
      width: 38px; height: 38px; border-radius: 4px;
      border: 1px solid var(--line); background: var(--surface-2); color: var(--fg);
      font-size: 18px; cursor: pointer;
    }
    .qty b { font-family: var(--mono); font-size: 18px; min-width: 24px; text-align: center; font-variant-numeric: tabular-nums; }

    input[type=text], input[type=tel], input[type=password], input[type=search], select {
      width: 100%;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--fg);
      border-radius: 4px;
      padding: 10px 11px;
      font: inherit;
      font-size: 14px;
      margin-top: 6px;
    }
    .pw { position: relative; margin-top: 6px; }
    .pw input { margin-top: 0 !important; padding-right: 68px; }
    .pw .eye {
      position: absolute; right: 5px; top: 50%; transform: translateY(-50%);
      border: 1px solid var(--line); background: var(--surface-2); color: var(--fg);
      border-radius: 3px; padding: 4px 9px; font: inherit; font-weight: 700; font-size: 12px; cursor: pointer;
    }

    .kv {
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
      padding: 9px 0; border-top: 1px solid var(--line);
    }
    .kv:first-child { border-top: 0; }
    .kv b { font-family: var(--mono); font-size: 16px; font-variant-numeric: tabular-nums; }

    .btn {
      width: 100%; border: 0; border-radius: 4px;
      background: var(--acc); color: var(--acc-ink);
      font: inherit; font-weight: 800; font-size: 15px; min-height: 46px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      padding: 0 16px; text-decoration: none;
    }
    .btn:disabled { background: var(--surface-2); color: var(--mut); border: 1px solid var(--line); cursor: not-allowed; }
    .btn.ok { background: var(--ok); color: #0e1410; }
    .btn.warn { background: var(--warn); color: #141413; }
    .btn.dark { background: var(--surface-2); color: var(--fg); border: 1px solid var(--line); }
    .btn.inline { margin-top: 10px; }

    .mini {
      border: 1px solid var(--line); background: var(--surface-2); color: var(--fg);
      border-radius: 4px; padding: 5px 10px; font: inherit; font-weight: 700; font-size: 12px;
      cursor: pointer; min-height: 34px; text-decoration: none;
      display: inline-flex; align-items: center; white-space: nowrap;
    }
    .mini:hover { border-color: var(--acc); }
    .link {
      background: none; border: 0; color: var(--mut); text-decoration: underline;
      font: inherit; font-size: 13px; cursor: pointer; margin-top: 8px; padding: 4px 0; display: inline-block;
    }
    .m { color: var(--mut); font-size: 13px; margin-top: 4px; }
    .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

    .card {
      background: var(--surface-2); border: 1px solid var(--line);

        : { img: drink && drink.img || "layered", baseVol: 320, dose: 18, ratio: DRINK_PROFILES.h2.ratio });
      const isSpec = drink && drink.g === "spec";
      const sizeKey = isSpec ? "M" : (selState.size || "M");
      const mult = sizeKey === "S" ? 0.75 : sizeKey === "L" ? 1.30 : 1.00;
      const qty = Math.max(1, selState.qty || 1);
      const cupMl = Math.round(prof.baseVol * mult);
      const totalOrderMl = cupMl * qty;
      const doseG = Math.round(prof.dose * (sizeKey === "L" ? 1.2 : sizeKey === "S" ? 0.88 : 1.0));
      const beanTag = selState.bean === "soe" ? (shop && shop.soe ? "SOE " + shop.soe : "SOE") : "House Blend";

      let running = 0;
      const layers = prof.ratio.map((l, idx) => {
        const ml = idx === prof.ratio.length - 1 ? Math.max(10, cupMl - running) : Math.round(cupMl * (l.pct / 100));
        running += ml;
        let name = lang === "en" ? l.en : l.zh;
        let detail = lang === "en" ? l.detailEn : l.detailZh;

          detail = `${milkTag} · ${detail}`;
        } else if (l.k === "espresso") {
          detail = `${doseG}g ${beanTag} · ${detail}`;
        }
        return { ...l, ml, totalMl: ml * qty, name, detail };
      });

        imgUrl: getCupImgForDrink({ ...(drink || {}), img: drink && drink.img ? drink.img : prof.img }),

        cupMl,
        totalOrderMl,
        doseG,
        beanTag,
        milkTag,
        layers

    function feeFps(shop, tot = 40) {
      const st = HUB.settings;
      const base = Math.min(4, Math.max(2, shop.fee != null ? shop.fee : st.fee));
      if (tot <= st.lowp) return r2(Math.min(base, st.lowf));
      return r2(base);
    }
    function feeStripe(shop, tot) {
      const st = HUB.settings;
      const base = Math.min(4, Math.max(2, shop.fee != null ? shop.fee : st.fee));
      const pct = tot <= st.thr ? st.pct : st.pct2;
      return r2(Math.max(st.cmin, base + st.fix + (pct / 100) * tot));
    }
    function billOf(code) {
      const f = HUB.fees.filter(x => x.code === code);
      const p = HUB.pays.filter(x => x.code === code);
      const fees = r2(f.reduce((a, b) => a + b.amt, 0));
      const col = r2(f.filter(x => x.col === 1).reduce((a, b) => a + b.amt, 0));
      const paid = r2(p.reduce((a, b) => a + b.amt, 0));
      return { orders: f.length, fees, collected: col, owed: r2(fees - col), paid, due: r2(fees - col - paid) };
    }
    function qualityOf(code) {
      const now = Date.now(), D = 864e5, D30 = 30 * D;
      const rows = HUB.ratings.filter(r => r.code === code && r.ts >= now - 90 * D).sort((a, b) => b.ts - a.ts);
      const avg = a => a.length ? Math.round(a.reduce((x, y) => x + y.score, 0) / a.length * 10) / 10 : null;
      const pc = (c, n) => n ? Math.round(c * 1000 / n) / 10 : null;
      const w30 = rows.filter(r => r.ts >= now - D30);
      const w7 = rows.filter(r => r.ts >= now - 7 * D);
      const p7 = rows.filter(r => r.ts < now - 7 * D && r.ts >= now - 14 * D);
      return {
        n: w30.length, avg: avg(w30), min: 5,
        perfect: pc(w30.filter(r => !r.tags.length).length, w30.length),
        trend: { now: w7.length >= 3 ? avg(w7) : null, prev: p7.length >= 3 ? avg(p7) : null },
        tags: Object.keys(QTAGS).map(tag => {
          const c = w30.filter(r => r.tags.includes(tag)).length;
          return { tag, pts: QTAGS[tag][0], dim: QTAGS[tag][1], count: c, pct: pc(c, w30.length) || 0, lost: c * QTAGS[tag][0] };
        }),
        actions: HUB.actions.filter(a => a.code === code).sort((a, b) => b.ts - a.ts).map(a => {
          const bf = rows.filter(r => r.ts < a.ts && r.ts >= a.ts - D30);
          const af = rows.filter(r => r.ts >= a.ts);
          const rate = l => l.length >= 3 ? pc(l.filter(r => r.tags.includes(a.tag)).length, l.length) : null;
          return { ts: a.ts, tag: a.tag, before: rate(bf), after: rate(af) };
        })
      };
    }

    function shrink(f, max = 99 * 1024) {
      return new Promise((ok, bad) => {
        const r = new FileReader();
        r.onerror = bad;
        r.onload = () => {
          const im = new Image();
          im.onerror = bad;
          im.onload = () => {
            let w = Math.min(1000, im.width);
            for (let i = 0; i < 8; i++) {
              const c = document.createElement("canvas");
              c.width = w;
              c.height = Math.round(im.height * w / im.width);
              const x = c.getContext("2d");
              x.fillStyle = "#fff";
              x.fillRect(0, 0, c.width, c.height);
              x.drawImage(im, 0, 0, c.width, c.height);
              for (let qy = 0.85; qy >= 0.35; qy -= 0.1) {
                const d = c.toDataURL("image/jpeg", qy);
                if ((d.length - 23) * 0.75 <= max) return ok(d);
              }
              w = Math.round(w * 0.8);
            }
            bad();
          };
          im.src = r.result;
        };
        r.readAsDataURL(f);
      });
    }

    function submitRate(tags) {

      const finalTags = [...new Set(tags)].filter(k => QTAGS[k] && k !== "wait");

    function merchLogIn() {
      const code = slugOf($("#lc").value.trim()), pin = $("#lp").value;
      const s = HUB.shops.find(x => x.code === code && x.status !== "removed" && x.pin === pin);
      if (!s) return toast(t("logerr"));
      merchLoggedCode = s.code;
      render();
    }
    function merchLogOut() { merchLoggedCode = null; render(); }

    function setOrderState(id, nextS) {
      const o = HUB.orders.find(x => x.id === id);
      const s = HUB.shops.find(x => x.code === merchLoggedCode);
      if (!o || !s) return;
      if (!(NEXT[o.s] || []).includes(nextS)) return;
      o.s = nextS;
      if (nextS === "ready") o.rt = Date.now();
      if (nextS === "making" && o.pm !== "stripe" && !HUB.fees.some(f => f.oid === o.id)) {
        HUB.fees.push({ oid: o.id, code: s.code, ts: Date.now(), amt: feeFps(s, o.tot), col: 0 });
      }
      saveHub();
      render();
    }
    function toggleChk(id) {
      const o = HUB.orders.find(x => x.id === id);
      if (o) { o.chk = o.chk ? 0 : 1; saveHub(); render(); }
    }
    function shopToggleOpen() {
      const s = HUB.shops.find(x => x.code === merchLoggedCode);
      if (!s) return;
      if (!s.open) {
        if (s.status !== "active") return toast(t("e_susp"));
        const lim = s.lim != null ? s.lim : HUB.settings.lim;
        if (lim > 0 && billOf(s.code).due >= lim) return toast(t("e_fee"));
      }
      s.open = s.open ? 0 : 1;
      saveHub();
      render();
    }
    function saveMenuChanges(s) {
      s.menu = md.map(x => ({ ...x, p: Math.max(0, Math.round(+x.p) || 0) })).filter(x => x.z || x.e);
      for (const k of ["L", "S", "om", "so"]) s.cfg[k] = Math.round(+mc[k]) || 0;
      md = null;
      saveHub();
      toast(t("m_saved"));
      render();
    }
    function blAdd(name, phone, note = "") {
      const s = HUB.shops.find(x => x.code === merchLoggedCode);
      if (!s || (!name && !phone)) return;
      const p4 = String(phone || "").replace(/\D/g, "").slice(-4);
      if (!s.blacklist.some(x => x.name.toLowerCase() === String(name).toLowerCase() && x.phone === p4)) {
        s.blacklist.push({ name: String(name).trim(), phone: p4, note });
        saveHub();
        render();
      }
    }
    function blRemove(name, phone) {
      const s = HUB.shops.find(x => x.code === merchLoggedCode);
      if (!s) return;
      const p4 = String(phone || "").replace(/\D/g, "").slice(-4);
      s.blacklist = s.blacklist.filter(x => !(x.name.toLowerCase() === String(name).toLowerCase() && x.phone === p4));
      saveHub();
      render();
    }
    function refundCardOrder(id) {
      if (rfArm !== id) {
        rfArm = id; toast(t("rfconfirm"));
        setTimeout(() => { if (rfArm === id) rfArm = null; }, 4000);
        return;
      }
      rfArm = null;
      const o = HUB.orders.find(x => x.id === id);
      if (!o || o.pm !== "stripe" || o.rf) return;
      o.rf = 1;
      if (["paid", "making"].includes(o.s)) o.s = "cancel";
      if (HUB.settings.refund_fee) {
        const f = HUB.fees.find(x => x.oid === id);
        if (f) f.amt = 0;
      }
      saveHub();
      toast(t("rfdone"));
      render();
    }

                  <div id="adm-list-rows">${buildAdminListRowsHtml(list, cfg, tierOf, stl, hint)}</div>

              ${srchRows ? `<div class="tw"><table><tr><th>店鋪</th><th>單號</th><th>稱呼</th><th>尾號</th><th>金額</th><th>狀態</th></tr>${srchRows.map(o => `<tr><td>${esc(o.code)}</td><td>#${o.n}</td><td>${esc(o.name || "-")}</td><td>${esc(o.phone || "-")}</td><td>$${o.tot}</td><td>${o.s}</td></tr>`).join("")}</table></div>` : ""}

    function renderAdminListRows() {
      const box = $("#adm-list-rows");
      if (!box) return;
      const cfg = HUB.settings;
      const tierOf = l => l === 200 ? "new" : l === 500 ? "normal" : l === 1000 ? "trusted" : l == null ? "def" : "custom";
      const stl = s => s === "removed" ? "已移除" : s === "suspended" ? "已暫停" : "運作中";
      const hint = s => {
        const days = (Date.now() - s.created) / 864e5, b = billOf(s.code), q = qualityOf(s.code);
        if (s.lim === 200 && days >= 28 && b.due === 0 && q.n >= 30 && q.avg >= 85) return `<p class="m"><b>可考慮升二級</b>：開店滿 4 週、冇欠費、${q.n} 個評分、品質分 ${q.avg}</p>`;
        if (s.lim === 500 && days >= 84 && b.due === 0 && q.n >= 60 && q.avg >= 90) return `<p class="m"><b>可考慮升三級</b>：開店滿 12 週、冇欠費、${q.n} 個評分、品質分 ${q.avg}</p>`;

      };
      const SORTS = {
        last: (a, b) => (b._la || 0) - (a._la || 0),

      };
      const enriched = HUB.shops.map(s => {
        const b = billOf(s.code), q = qualityOf(s.code), o = HUB.orders.filter(x => x.code === s.code);
        const la = o.reduce((m, x) => Math.max(m, x.ts), 0);
        const td = o.filter(x => x.s !== "cancel" && x.s !== "unpaid" && dk(x.ts) === dk(Date.now())).length;
        return { ...s, _b: b, _due: b.due, _q: q, _qs: q.n >= 5 ? q.avg : null, _la: la, _td: td, _dpn: o.filter(x => x.dp).length };

      if (mode === "customer") {
        main.innerHTML = renderCustomerPage();
        syncHeroVisuals();
        syncStudioVisuals();
        renderOrderDesk();
        applyScrollTransforms(scrollCurP);

        const vs = $("#vitrine-stage");
        if (vs && vs.addEventListener) {
          vs.addEventListener("pointermove", e => {
            const r = vs.getBoundingClientRect();
            ptrTiltY = ((e.clientX - r.left) / r.width - 0.5) * 8;
            ptrTiltX = -((e.clientY - r.top) / r.height - 0.5) * 6;
          });
          vs.addEventListener("pointerleave", () => { ptrTiltX = 0; ptrTiltY = 0; });
        }
        const sh = $("#scroll-hero");
        if (sh && typeof IntersectionObserver !== "undefined") {
          if (heroObserver) heroObserver.disconnect();
          heroObserver = new IntersectionObserver(entries => {
            heroVisible = entries[0] ? entries[0].isIntersecting : true;
          }, { threshold: 0.01 });
          heroObserver.observe(sh);
        }
      } else if (mode === "merchant") {
        main.innerHTML = renderMerchantPage();
      } else {
        main.innerHTML = renderAdminPage();
      }
    }

    if (window.addEventListener) {
      window.addEventListener("scroll", updateScrollProgress, { passive: true });
    }
    render();
    animLoop();
  </script>
</body>
</html>
