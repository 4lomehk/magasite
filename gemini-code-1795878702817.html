  * {

  .callout.right .callout-card {

  .callout.left .callout-card {

  .callout-kicker {

  .callout-title {

  .callout-sub {

  /* Hero Finale Title Lockup */
  #hero-lockup {

<script type="module">
import * as THREE from 'three';

const WIDTH = 1080;
const HEIGHT = 1920;
window.DURATION = 20;

// Deterministic PRNG (Mulberry32) so every frame t is 100% reproducible
function mulberry32(seed) {
  let a = seed >>> 0;
  return function() {
    a |= 0;
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// Smooth math helpers
const clamp01 = (v) => Math.max(0, Math.min(1, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = (e0, e1, x) => {
  const t = clamp01((x - e0) / (e1 - e0));
  return t * t * (3 - 2 * t);
};
const smootherstep = (e0, e1, x) => {
  const t = clamp01((x - e0) / (e1 - e0));
  return t * t * t * (t * (t * 6 - 15) + 10);
};
function easeOutBack(x) {
  const c1 = 1.45;
  const c3 = c1 + 1;
  const t = clamp01(x);
  return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
}
function easeOutCubic(x) {
  const t = clamp01(x);
  return 1 - Math.pow(1 - t, 3);
}

// Renderer setup
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({
  canvas,
  antialias: true,
  alpha: true,
  powerPreference: 'high-performance',
  preserveDrawingBuffer: true
});
renderer.setSize(WIDTH, HEIGHT, false);
renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0xe6ebf8, 0.024);

const camera = new THREE.PerspectiveCamera(34, WIDTH / HEIGHT, 0.1, 100);
camera.position.set(0, 2.2, 11.5);

// Procedural Studio Environment Map (PMREM) for crisp glossy bottle & blueberry speculars
function createStudioEnvMap() {
  const envCanvas = document.createElement('canvas');
  envCanvas.width = 512;
  envCanvas.height = 256;
  const ctx = envCanvas.getContext('2d');

  const grad = ctx.createLinearGradient(0, 0, 0, 256);
  grad.addColorStop(0.0, '#ffffff');
  grad.addColorStop(0.35, '#eef2fc');
  grad.addColorStop(0.68, '#d4dcf2');
  grad.addColorStop(1.0, '#bac5e6');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 512, 256);

  // Soft studio softbox strips for realistic bottle highlights
  ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
  ctx.beginPath();
  ctx.roundRect(45, 24, 90, 175, 24);
  ctx.fill();

  ctx.beginPath();
  ctx.roundRect(355, 28, 105, 170, 26);
  ctx.fill();

  ctx.fillStyle = 'rgba(124, 142, 214, 0.35)';
  ctx.beginPath();
  ctx.roundRect(205, 45, 95, 150, 20);
  ctx.fill();

  const tex = new THREE.CanvasTexture(envCanvas);
  tex.mapping = THREE.EquirectangularReflectionMapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  const pmrem = new THREE.PMREMGenerator(renderer);
  const envRT = pmrem.fromEquirectangular(tex);
  tex.dispose();
  pmrem.dispose();
  return envRT.texture;
}
scene.environment = createStudioEnvMap();

// Studio Lighting
const hemiLight = new THREE.HemisphereLight(0xffffff, 0xc7d0eb, 1.35);
hemiLight.position.set(0, 12, 0);
scene.add(hemiLight);

const keyLight = new THREE.DirectionalLight(0xfffcf7, 1.85);
keyLight.position.set(4.8, 8.6, 6.2);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.near = 1;
keyLight.shadow.camera.far = 25;
keyLight.shadow.camera.left = -5.5;
keyLight.shadow.camera.right = 5.5;
keyLight.shadow.camera.top = 7.5;
keyLight.shadow.camera.bottom = -4.5;
keyLight.shadow.bias = -0.0004;
keyLight.shadow.normalBias = 0.02;
scene.add(keyLight);

const rimLight = new THREE.DirectionalLight(0xc2ceff, 1.15);
rimLight.position.set(-5.5, 5.5, -5.0);
scene.add(rimLight);

const fillLight = new THREE.DirectionalLight(0xf6f8ff, 0.7);
fillLight.position.set(-4.5, 2.2, 5.5);
scene.add(fillLight);

// Studio Plinth & Seamless Ground
const studioGroup = new THREE.Group();
scene.add(studioGroup);

const shadowFloor = new THREE.Mesh(
  new THREE.PlaneGeometry(40, 40),
  new THREE.ShadowMaterial({ opacity: 0.14, color: 0x3b4778 })
);
shadowFloor.rotation.x = -Math.PI / 2;
shadowFloor.position.y = -2.35;
shadowFloor.receiveShadow = true;
studioGroup.add(shadowFloor);

// Layered architectural studio pedestals (creamy marble & soft periwinkle rim)
const plinthBase = new THREE.Mesh(
  new THREE.CylinderGeometry(2.75, 2.9, 0.28, 96),
  new THREE.MeshPhysicalMaterial({
    color: 0xe3e8f7,
    roughness: 0.45,
    metalness: 0.02,
    clearcoat: 0.25
  })
);
plinthBase.position.y = -2.21;
plinthBase.receiveShadow = true;
plinthBase.castShadow = true;
studioGroup.add(plinthBase);

const plinthTop = new THREE.Mesh(
  new THREE.CylinderGeometry(2.22, 2.28, 0.22, 96),
  new THREE.MeshPhysicalMaterial({
    color: 0xfbfcff,
    roughness: 0.28,
    metalness: 0.0,
    clearcoat: 0.5,
    clearcoatRoughness: 0.2
  })
);
plinthTop.position.y = -1.96;
plinthTop.receiveShadow = true;
plinthTop.castShadow = true;
studioGroup.add(plinthTop);

const plinthAccentRing = new THREE.Mesh(
  new THREE.TorusGeometry(2.225, 0.018, 24, 120),
  new THREE.MeshStandardMaterial({
    color: 0x7c8cc9,
    roughness: 0.35,
    metalness: 0.15
  })
);
plinthAccentRing.rotation.x = Math.PI / 2;
plinthAccentRing.position.y = -1.85;
studioGroup.add(plinthAccentRing);

// ============================================================================
// HIGH-RESOLUTION BOTTLE LABEL TEXTURE (With completely blurred brand & logo)
// ============================================================================
function createBottleLabelTexture() {
  const W = 2048;
  const H = 1536;
  const c = document.createElement('canvas');
  c.width = W;
  c.height = H;
  const ctx = c.getContext('2d');

  // 1. Creamy cultured milk background with soft blueberry gradient bands
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0.0, '#fbfbff');
  bg.addColorStop(0.24, '#f5f6fd');
  bg.addColorStop(0.56, '#eef1fc');
  bg.addColorStop(0.78, '#6a78bc');
  bg.addColorStop(1.0, '#445299');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // Decorative organic creamy milk wave & blueberry wave across lower body
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(0, H * 0.62);
  for (let x = 0; x <= W; x += 32) {
    const wave = Math.sin((x / W) * Math.PI * 4) * 34 + Math.cos((x / W) * Math.PI * 2) * 22;
    ctx.lineTo(x, H * 0.63 + wave);
  }
  ctx.lineTo(W, H);
  ctx.lineTo(0, H);
  ctx.closePath();
  const waveGrad = ctx.createLinearGradient(0, H * 0.58, 0, H);
  waveGrad.addColorStop(0, '#5a69b5');
  waveGrad.addColorStop(0.55, '#3d4b94');
  waveGrad.addColorStop(1, '#2a3573');
  ctx.fillStyle = waveGrad;
  ctx.fill();

  // Secondary lighter periwinkle ribbon wave
  ctx.beginPath();
  ctx.moveTo(0, H * 0.67);
  for (let x = 0; x <= W; x += 32) {
    const wave = Math.cos((x / W) * Math.PI * 4 + 0.8) * 28;
    ctx.lineTo(x, H * 0.68 + wave);
  }
  ctx.lineTo(W, H);
  ctx.lineTo(0, H);
  ctx.closePath();
  ctx.fillStyle = 'rgba(138, 153, 224, 0.34)';
  ctx.fill();
  ctx.restore();

  // Subtle botanical & milk-swirl line art on sides
  ctx.save();
  ctx.strokeStyle = 'rgba(92, 108, 184, 0.14)';
  ctx.lineWidth = 6;
  for (let s = 0; s < 2; s++) {
    const baseX = s === 0 ? 280 : W - 280;
    ctx.beginPath();
    ctx.arc(baseX, H * 0.42, 170, 0, Math.PI * 2);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(baseX, H * 0.42, 225, 0.4, Math.PI * 1.6);
    ctx.stroke();
  }
  ctx.restore();

  // Front Panel Center X = W * 0.5 (UV u = 0.5 faces +Z camera)
  const cx = W * 0.5;

  // 2. Top Brand Emblem & Wordmark Area — Drawn on an offscreen layer and heavily blurred
  // so no brand name or logo can be read or identified
  const brandLayer = document.createElement('canvas');
  brandLayer.width = 760;
  brandLayer.height = 340;
  const bctx = brandLayer.getContext('2d');

  // Abstract crest shape + indistinct letterforms prior to multi-pass heavy blur
  bctx.fillStyle = '#38468c';
  bctx.beginPath();
  bctx.roundRect(140, 28, 480, 120, 60);
  bctx.fill();

  bctx.fillStyle = '#ffffff';
  bctx.font = '900 74px Georgia, serif';
  bctx.textAlign = 'center';
  bctx.fillText('BRANDMARK', 380, 112);

  bctx.fillStyle = '#4857a3';
  bctx.font = '800 54px sans-serif';
  bctx.fillText('EST. DAIRY CO.', 380, 215);

  // Apply heavy multi-pass Gaussian blur + pixelation mosaic so it is 100% unreadable
  const tiny = document.createElement('canvas');
  tiny.width = 24;
  tiny.height = 11;
  const tctx = tiny.getContext('2d');
  tctx.drawImage(brandLayer, 0, 0, tiny.width, tiny.height);

  ctx.save();
  ctx.filter = 'blur(26px)';
  ctx.globalAlpha = 0.72;
  ctx.drawImage(tiny, cx - 350, 95, 700, 310);
  ctx.filter = 'blur(18px)';
  ctx.drawImage(tiny, cx - 340, 105, 680, 290);
  ctx.restore();

  // Frosted privacy badge pill over the blurred brand zone
  ctx.save();
  ctx.fillStyle = 'rgba(255, 255, 255, 0.48)';
  ctx.beginPath();
  ctx.roundRect(cx - 255, 130, 510, 155, 78);
  ctx.fill();
  ctx.strokeStyle = 'rgba(116, 131, 201, 0.32)';
  ctx.lineWidth = 4;
  ctx.stroke();
  ctx.restore();

  // 3. Clear, Crisp Product Identity Typography (Matching Reference Details)
  // "Kefir" main display title
  ctx.save();
  ctx.fillStyle = '#252f63';
  ctx.font = '800 164px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('Kefir', cx, 425);

  // "cultured lowfat milk" subtitle badge
  ctx.fillStyle = '#5362ab';
  ctx.font = '700 44px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
  ctx.letterSpacing = '6px';
  ctx.fillText('CULTURED LOWFAT MILK', cx, 535);
  ctx.letterSpacing = '0px';

  // "Blueberry" flavor callout banner
  ctx.fillStyle = '#36448c';
  ctx.beginPath();
  ctx.roundRect(cx - 235, 595, 470, 96, 48);
  ctx.fill();

  ctx.fillStyle = '#ffffff';
  ctx.font = '800 56px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
  ctx.fillText('Blueberry', cx, 645);
  ctx.restore();

  // 4. Illustrated Ripe Blueberries & Creamy Milk Splash Cluster on Label Front
  function drawLabelBlueberry(bx, by, r, rot) {
    ctx.save();
    ctx.translate(bx, by);
    ctx.rotate(rot);

    // Soft drop shadow
    ctx.fillStyle = 'rgba(22, 30, 74, 0.28)';
    ctx.beginPath();
    ctx.arc(6, 12, r * 1.02, 0, Math.PI * 2);
    ctx.fill();

    // Berry body gradient
    const bgBerry = ctx.createRadialGradient(-r * 0.32, -r * 0.35, r * 0.1, 0, 0, r);
    bgBerry.addColorStop(0.0, '#8d9ee8');
    bgBerry.addColorStop(0.35, '#4b5cb0');
    bgBerry.addColorStop(0.8, '#2b3675');
    bgBerry.addColorStop(1.0, '#1c2454');
    ctx.fillStyle = bgBerry;
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fill();

    // Specular bloom
    ctx.fillStyle = 'rgba(255, 255, 255, 0.42)';
    ctx.beginPath();
    ctx.ellipse(-r * 0.34, -r * 0.34, r * 0.26, r * 0.15, -0.6, 0, Math.PI * 2);
    ctx.fill();

    // Star-shaped blossom crown
    ctx.fillStyle = '#1b224f';
    ctx.beginPath();
    const spikes = 5;
    for (let i = 0; i < spikes * 2; i++) {
      const rad = i % 2 === 0 ? r * 0.32 : r * 0.14;
      const ang = (i * Math.PI) / spikes;
      const px = Math.cos(ang) * rad;
      const py = Math.sin(ang) * rad - r * 0.58;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  // Creamy milk splash arc behind berries
  ctx.save();
  ctx.fillStyle = 'rgba(255, 255, 255, 0.92)';
  ctx.beginPath();
  ctx.moveTo(cx - 260, 955);
  ctx.bezierCurveTo(cx - 190, 815, cx - 50, 855, cx, 920);
  ctx.bezierCurveTo(cx + 65, 835, cx + 205, 815, cx + 265, 965);
  ctx.bezierCurveTo(cx + 150, 1045, cx - 150, 1045, cx - 260, 955);
  ctx.fill();
  ctx.restore();

  drawLabelBlueberry(cx - 115, 925, 76, -0.35);
  drawLabelBlueberry(cx + 110, 932, 72, 0.42);
  drawLabelBlueberry(cx, 888, 92, 0.12);
  drawLabelBlueberry(cx - 48, 995, 64, -0.2);
  drawLabelBlueberry(cx + 58, 992, 62, 0.28);

  // 5. Bottom Specs Pill: "1% milkfat" & "946 ml"
  ctx.save();
  ctx.fillStyle = 'rgba(255, 255, 255, 0.94)';
  ctx.beginPath();
  ctx.roundRect(cx - 310, 1135, 620, 114, 57);
  ctx.fill();

  ctx.fillStyle = '#242e61';

function createBlueberryMesh(seed = 1) {
  const rng = mulberry32(seed);
  const group = new THREE.Group();

  // Slightly oblate berry sphere with subtle organic vertex perturbation
  const geo = new THREE.SphereGeometry(0.24, 36, 28);
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    let x = pos.getX(i);
    let y = pos.getY(i) * 0.88;
    let z = pos.getZ(i);
    const n = 1 + 0.035 * Math.sin(x * 14 + seed) * Math.cos(z * 14 - seed);
    pos.setXYZ(i, x * n, y * n, z * n);
  }
  geo.computeVertexNormals();

  const berryMat = new THREE.MeshPhysicalMaterial({
    color: 0x35438a,
    roughness: 0.34,
    metalness: 0.02,
    clearcoat: 0.42,
    clearcoatRoughness: 0.26,
    sheen: 0.75,
    sheenRoughness: 0.55,
    sheenColor: new THREE.Color(0x9aa8eb)
  });

  const berry = new THREE.Mesh(geo, berryMat);
  berry.castShadow = true;
  berry.receiveShadow = true;
  group.add(berry);

  // Calyx crown (5-pointed star sepals at top)
  const crownMat = new THREE.MeshStandardMaterial({
    color: 0x20295c,
    roughness: 0.65
  });
  for (let k = 0; k < 5; k++) {
    const ang = (k / 5) * Math.PI * 2 + rng() * 0.2;
    const sepal = new THREE.Mesh(new THREE.ConeGeometry(0.036, 0.075, 6), crownMat);
    sepal.position.set(Math.cos(ang) * 0.055, 0.205, Math.sin(ang) * 0.055);
    sepal.rotation.z = -Math.cos(ang) * 0.55;
    sepal.rotation.x = Math.sin(ang) * 0.55;
    group.add(sepal);
  }

  return group;
}

function createMilkRibbon(radiusX, radiusZ, yStart, yEnd, turns, tubeRadius) {
  const pts = [];
  const steps = 90;
  for (let i = 0; i <= steps; i++) {
    const u = i / steps;
    const ang = u * Math.PI * 2 * turns;
    const taper = Math.sin(u * Math.PI);
    const rx = radiusX * (0.85 + 0.25 * taper);
    const rz = radiusZ * (0.85 + 0.25 * taper);
    const y = lerp(yStart, yEnd, u) + Math.sin(u * Math.PI * 3) * 0.14;
    pts.push(new THREE.Vector3(Math.cos(ang) * rx, y, Math.sin(ang) * rz));
  }
  const curve = new THREE.CatmullRomCurve3(pts);
  const geo = new THREE.TubeGeometry(curve, 120, tubeRadius, 16, false);
  // Taper ribbon ends smoothly
  const pos = geo.attributes.position;
  const center = new THREE.Vector3();
  const v = new THREE.Vector3();
  const radialSegments = 16;
  const tubularSegments = 120;
  for (let i = 0; i <= tubularSegments; i++) {
    const u = i / tubularSegments;
    curve.getPointAt(u, center);
    const env = Math.pow(Math.sin(u * Math.PI), 0.55);
    for (let j = 0; j <= radialSegments; j++) {
      const idx = i * (radialSegments + 1) + j;
      v.fromBufferAttribute(pos, idx);
      v.sub(center).multiplyScalar(env).add(center);
      pos.setXYZ(idx, v.x, v.y, v.z);
    }
  }
  geo.computeVertexNormals();
  const mesh = new THREE.Mesh(geo, milkMaterial);
  mesh.castShadow = true;
  return mesh;
}

const projVec = new THREE.Vector3();
function updateProjectedLabel(el, obj3D, visibility, slideOffset) {
  if (visibility <= 0.001) {
    el.style.opacity = '0';
    return;
  }
  obj3D.getWorldPosition(projVec);
  projVec.project(camera);

  const sx = (projVec.x * 0.5 + 0.5) * WIDTH;
  const sy = (-projVec.y * 0.5 + 0.5) * HEIGHT;

  const isLeft = el.classList.contains('left');
  const dx = (isLeft ? -1 : 1) * (1 - visibility) * slideOffset;

  el.style.opacity = visibility.toFixed(3);
  el.style.transform = `translate3d(${(sx + dx).toFixed(1)}px, ${sy.toFixed(1)}px, 0)`;
}

// ============================================================================
// DETERMINISTIC TIMELINE CHOREOGRAPHY (0s -> 20s)
// ============================================================================
// 0.0s - 2.2s : Studio Plinth & Creamy Atmosphere Reveal
// 1.4s - 4.2s : Step 1 — Translucent Bottle Shell rises & settles onto plinth
// 3.2s - 5.8s : Step 2 — Cultured Blueberry Kefir Liquid Core fills inside
// 4.8s - 7.6s : Step 3 — Full-Wrap Blueberry Kefir Sleeve Label glides & wraps into place
// 6.6s - 8.8s : Step 4 — Indigo Ribbed Cap descends and twists locked onto neck
// 7.5s - 11.5s: Step 5 — Milk Swirl Ribbons & Ripe Blueberries bloom into orbit
// 8.5s - 16.5s: Guided Product Callout Labels ("Kefir", "Blueberry", "1% Milkfat", "946 ml")
// 15.5s - 20.0s: Cinematic Finale Hero Framing & Lockup
window.renderAt = function(t) {
  const time = Math.max(0, Math.min(window.DURATION, t));

  // 1. Plinth entrance
  const pPlinth = smootherstep(0.0, 2.0, time);
  studioGroup.position.y = lerp(-1.4, 0, easeOutCubic(pPlinth));

  // 2. Step-by-step Bottle Assembly
  // Step A: Bottle Shell
  const pShell = smootherstep(1.2, 3.6, time);
  const shellEase = easeOutBack(pShell);
  bottleShellGroup.visible = pShell > 0.001;
  bottleShellGroup.position.y = lerp(3.8, 0, shellEase);
  bottleShellGroup.scale.setScalar(lerp(0.84, 1.0, easeOutCubic(pShell)));

  // Step B: Cultured Liquid Core
  const pLiquid = smootherstep(2.9, 5.2, time);
  liquidCoreGroup.visible = pLiquid > 0.001;
  const liqScaleY = easeOutCubic(pLiquid);
  liquidCoreGroup.scale.set(
    lerp(0.75, 1.0, liqScaleY),
    Math.max(0.001, liqScaleY),
    lerp(0.75, 1.0, liqScaleY)
  );
  liquidCoreGroup.position.y = lerp(-1.9 * (1 - liqScaleY), 0, liqScaleY);

  // Step C: Wrap Label Sleeve (descends with subtle rotational alignment)
  const pLabel = smootherstep(4.6, 7.0, time);
  const labelEase = easeOutCubic(pLabel);
  labelSleeveGroup.visible = pLabel > 0.001;
  labelSleeveGroup.position.y = lerp(3.4, 0, labelEase);
  labelSleeveGroup.rotation.y = lerp(-Math.PI * 0.85, 0, labelEase);
  const labelRadScale = lerp(1.06, 1.0, smootherstep(6.0, 7.2, time));
  labelSleeveGroup.scale.set(labelRadScale, 1, labelRadScale);

  // Step D: Ribbed Cap drops & screws down onto threads
  const pCapDrop = smootherstep(6.4, 8.0, time);
  const pCapTwist = smootherstep(7.6, 8.7, time);
  capGroup.visible = pCapDrop > 0.001;
  capGroup.position.y = lerp(2.8, 0.14, easeOutCubic(pCapDrop)) - 0.14 * pCapTwist;
  capGroup.rotation.y = lerp(Math.PI * 1.5, 0, pCapTwist);

  // Subtle hero bottle floating & showcase rotation
  const showcaseSpin =
    smootherstep(7.2, 13.5, time) * (Math.PI * 0.32) -
    smootherstep(13.5, 18.0, time) * (Math.PI * 0.32);
  const gentleFloat = Math.sin(time * 1.15) * 0.045 * smootherstep(7.5, 9.5, time);
  bottleRoot.position.y = 0.18 + gentleFloat;
  bottleRoot.rotation.y = showcaseSpin;
  bottleRoot.rotation.z = Math.sin(time * 0.8) * 0.018 * smootherstep(8.0, 10.0, time);

  // 3. Milk Swirl Ribbons & Floating Droplets
  const pSwirl = smootherstep(7.2, 9.8, time);
  milkSwirlGroup.visible = pSwirl > 0.001;
  milkSwirlGroup.scale.setScalar(easeOutCubic(pSwirl));
  milkSwirlGroup.rotation.y = time * 0.28;
  milkSwirlGroup.position.y = Math.sin(time * 1.1) * 0.06;

  const pDroplets = smootherstep(7.6, 10.2, time);
  droplets.forEach((d, idx) => {
    const localP = clamp01(pDroplets * 1.25 - (idx % 5) * 0.05);
    const sc = d.sc * easeOutBack(localP);
    d.mesh.visible = sc > 0.005;
    d.mesh.scale.setScalar(Math.max(0.001, sc));
    const curAng = d.ang + time * d.speed;
    const bob = Math.sin(time * 1.6 + d.phase) * 0.14;
    d.mesh.position.set(
      Math.cos(curAng) * d.dist,
      d.y + bob,
      Math.sin(curAng) * d.dist
    );
  });

  // 4. Ripe Blueberries Choreography
  const pBerries = smootherstep(7.0, 9.6, time);
  blueberries.forEach((b, idx) => {
    const stagger = idx * 0.14;
    const bp = smootherstep(7.0 + stagger, 9.2 + stagger, time);
    const sc = b.cfg.scale * easeOutBack(bp);
    b.mesh.visible = sc > 0.005;
    b.mesh.scale.setScalar(Math.max(0.001, sc));

    if (b.cfg.orbit) {
      const orbitAng = time * 0.34 + b.cfg.phase;
      const rad = Math.hypot(b.cfg.base.x, b.cfg.base.z);
      const baseAng = Math.atan2(b.cfg.base.z, b.cfg.base.x);
      const a = baseAng + orbitAng * 0.45;
      b.mesh.position.set(
        Math.cos(a) * rad,
        b.cfg.base.y + Math.sin(time * 1.4 + b.cfg.phase) * 0.15,
        Math.sin(a) * rad
      );
      b.mesh.rotation.set(
        b.cfg.rot[0] + time * 0.45,
        b.cfg.rot[1] + time * 0.6,
        b.cfg.rot[2] + time * 0.3
      );
    } else {
      b.mesh.position.copy(b.cfg.base);
      b.mesh.position.y = lerp(-2.6, b.cfg.base.y, easeOutBack(bp));
      b.mesh.rotation.set(b.cfg.rot[0], b.cfg.rot[1] + time * 0.12, b.cfg.rot[2]);
    }
  });

  // 5. Cinematic Slow Camera Movement
  // Starts elevated & wider, glides smoothly closer during assembly & callouts, then settles in a clean hero portrait framing
  const camIntro = smootherstep(0.0, 8.5, time);
  const camMid = smootherstep(8.5, 15.5, time);
  const camOut = smootherstep(15.5, 20.0, time);

  const camX =
    Math.sin(time * 0.28) * 0.55 * (1 - camOut * 0.65);
  const camY =
    lerp(2.35, 0.62, camIntro) +
    lerp(0.0, -0.22, camMid) +
    lerp(0.0, 0.24, camOut);
  const camZ =
    lerp(12.2, 9.6, camIntro) +
    lerp(0.0, -0.45, camMid) +
    lerp(0.0, 0.95, camOut);

  camera.position.set(camX, camY, camZ);
  const lookY = lerp(0.25, 0.08, camIntro) + lerp(0, -0.14, camOut);
  camera.lookAt(0, lookY, 0);

  // Update world matrices before projecting 3D callout anchors
  scene.updateMatrixWorld(true);

  // 6. Editorial Overlays & Projected Product Detail Callouts
  const topBarVis = smootherstep(1.2, 2.5, time);
  domTopBar.style.opacity = topBarVis.toFixed(3);
  domTopBar.style.transform = `translateY(${((1 - topBarVis) * -14).toFixed(1)}px)`;

  const visKefir =
    smootherstep(8.4, 9.3, time) * (1 - smootherstep(15.2, 16.0, time));
  const visBlueberry =
    smootherstep(9.2, 10.1, time) * (1 - smootherstep(15.4, 16.2, time));
  const visMilkfat =
    smootherstep(10.0, 10.9, time) * (1 - smootherstep(15.6, 16.4, time));
  const visVolume =
    smootherstep(10.8, 11.7, time) * (1 - smootherstep(15.8, 16.6, time));

  updateProjectedLabel(domLblKefir, anchorKefir, visKefir, 28);
  updateProjectedLabel(domLblBlueberry, anchorBlueberry, visBlueberry, 28);
  updateProjectedLabel(domLblMilkfat, anchorMilkfat, visMilkfat, 28);
  updateProjectedLabel(domLblVolume, anchorVolume, visVolume, 28);

  const heroVis = smootherstep(16.0, 17.4, time);
  domHeroLockup.style.opacity = heroVis.toFixed(3);
  domHeroLockup.style.transform = `translateY(${((1 - heroVis) * 26).toFixed(1)}px)`;

  // Render exact frame
  renderer.render(scene, camera);
};

// Render initial frame at t = 0
window.renderAt(0);
</script>
</body>
